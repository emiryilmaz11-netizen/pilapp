  $('#done').onclick = () => bitir(W.packages.filter(p=>String(p.ad).trim()));
  $('#skip').onclick = () => bitir([]);
}

/* --- kurulumu tamamla --- */
function bitir(paketler){
  DB = migrate(blank());
  const ilk = bransOf(W.brans[0]);

  DB.studio = { name:W.name, unit:ilk.birim, cap:ilk.kap, open:'07:00', close:'22:00',
                showPrice:false, rules:{ ...DEFAULT_RULES }, createdAt:iso(new Date()),
                lang:lang(), currency:curCode(), cc:ccOf() };

  // Her branş kendi salonunu alır — aynı saatte paralel ders açılabilsin
  DB.rooms = W.brans.map(k=>{ const b = bransOf(k);
    return { id:uid(), name: isEN() ? `${b.en||b.ad} Area` : `${b.ad} Alanı`,
             cap:b.kap, unit:b.birim }; });

  DB.trainers = W.trainers.map(n=>({ id:uid(), name:n }));

  DB.services = W.brans.map((k,i)=>{ const b = bransOf(k);
    return { id:uid(), name: isEN() ? (b.en||b.ad) : b.ad,
             dur:b.sure, cap:b.kap, roomId:DB.rooms[i].id }; });

  // Branştan gelen örnek paket yalnızca o branşın dersinde geçerli
  DB.packages = paketler.map(p=>{ const i = p.brans ? W.brans.indexOf(p.brans) : -1;
    return { id:uid(), name:p.ad, count:p.adet, days:p.gun, price:p.fiyat,
             serviceIds: (i >= 0 && W.brans.length > 1) ? [DB.services[i].id] : [] }; });

  logAct('kurulum', `${W.name} · ${DB.services.length} ders tipi · ${DB.trainers.length} eğitmen`);
  save();
  nav = 'program';
  renderShell(); route();
  setTimeout(()=>bulkProgramModal(), 300);
  toast('Hazır. Şimdi ders saatlerini açalım.');
}

/* Ekranı başa sar.
   ÇİZİMDEN SONRA çağrılır. Önce çağrılırsa sayfa eski ekranın
   uzunluğuna göre kaydırılıyor, sonra daha kısa olan yeni ekran
   çiziliyor ve iOS Safari kaydırma konumunu düzeltmiyor: üst taraf
   kesik kalıyor ve ancak sayfa yenilenince düzeliyor.
   Bir sonraki karede bir kez daha denenir, çünkü yeni içeriğin
   yüksekliği o ana kadar kesinleşmiş olmuyor. */
function basaSar(){
  const git = () => {
    try {
      if (typeof window.scrollTo === 'function') window.scrollTo(0, 0);
      const se = document.scrollingElement || document.documentElement;
      if (se) se.scrollTop = 0;
      if (document.body) document.body.scrollTop = 0;
    } catch(e){}
  };
  git();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(git);
}

function route(){

     program:viewProgram, members:viewMembers, cash:viewCash, menu:viewMenu,
     trainer:viewTrainer, member:viewMember, settings:viewSettings, log:viewLog })[nav]();
  /* Menü alt sayfalarında geri dönüş — alt menüde Menü sekmesi yok */
  if (tab === 'menu' && nav !== 'menu'){
    const v = $('#view'), bk = document.createElement('button');

    bk.onclick = () => { nav = 'menu'; route(); };

  }
  basaSar();                          // içerik çizildikten SONRA
}

  all.forEach(k=>{ cap += capOf(svc(k.serviceId));
    taken += bookingsOf(k.key).filter(b=>b.status!=='waitlist').length; });

  const next = all.filter(k=>minutes(k.time) >= nowM)
    .sort((a,b)=>a.time.localeCompare(b.time))[0];
  const mins = next ? minutes(next.time) - nowM : null;

  const pays = (DB.payments||[]).filter(p=>p.date===dISO);
  const cashToday = pays.reduce((x,p)=>x+p.amount,0);

  const soonExp = DB.plans.filter(p=>planValid(p,dISO) && p.expires
    && (new Date(p.expires) - now)/86400000 <= 14);

  /* paketi bitiyor — ders hakkı azalan ya da süresi dolan üyeler (tekil) */
  const ending = new Set([...lowCredit, ...soonExp].map(p=>p.memberId)).size;

  /* --- hafta şeridi --- */

/* Hızlı rezervasyon — önce ders seç, sonra üye */
function quickBook(preMember){
  const dISO = iso(new Date());
  const nowM = new Date().getHours()*60 + new Date().getMinutes();
  const opts = [];
  for (let i=0; i<7; i++){
    const d = addDays(new Date(), i), di = iso(d);
    classesOn(di).filter(k=>!k.cancelled).forEach(k=>{
      if (i===0 && minutes(k.time) < nowM) return;
      const s = svc(k.serviceId), cp = capOf(s);
      const n = bookingsOf(k.key).filter(b=>b.status!=='waitlist').length;
      opts.push({ k, d, di, s, cp, n });
    });
  }
  if (!opts.length) return toast('Önümüzdeki 7 günde ders yok', true);

  openModal(`<div class="mhead"><div class="row sp">

function bookModal(key, preMember){

    .map(m=>{ const p = planOf(m.id, ser?.serviceId, dISO);
      return { m, p, l:left(p),
               blocks: bookingBlocks(m.id, key, ser?.serviceId, dISO, ser?.time) }; })

  if (preMember){

  const q = $('#q');
  if (q){ q.focus(); q.oninput = () => { const t=q.value.toLocaleLowerCase('tr');
    $('#picks').querySelectorAll('.pick').forEach(p=>
      p.style.display = p.querySelector('.nm').textContent.toLocaleLowerCase('tr').includes(t)?'':'none'); }; }
  const nm = $('#newm'); if (nm) nm.onclick = () => { closeAll(); memberModal(); };

  $('#modal').querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>lock(b, ()=>{
    const mid = b.dataset.pick;
    // Engel varsa SESSİZCE geçme — sebebi göster
    const blocks = bookingBlocks(mid, key, ser?.serviceId, dISO, ser?.time);
    if (blocks.length){
      toast(`${firstN(mem(mid).name)} eklenemedi: ${blocks.join(', ')}`, true);
      return;
    }
    const p = planOf(mid, ser?.serviceId, dISO);
    const wait = bookingsOf(key).length >= capOf(s);
    const nb = { id:uid(), key, memberId:mid, planId:p.id, status:'new' };
    DB.bookings.push(nb);
    settleBooking(nb, wait ? 'waitlist' : 'booked');

               : `${firstN(mem(mid).name)} derse eklendi · ${left(p)} hak kaldı`);

/* Doluluk skalası — hafta ve ay ızgarası aynı renkleri kullanır */
const fillClass = (n, cp) => { const r = cp ? n/cp : 0;
  return r >= 1 ? 'f3' : r >= .7 ? 'f2' : r >= .4 ? 'f1' : 'f0'; };
const takenOf = k => bookingsOf(k.key).filter(b=>b.status!=='waitlist').length;

/* Yatay kaydırma ile önceki / sonraki */
function bindSwipe(el, onPrev, onNext){
  if (!el) return;
  let x0 = null, y0 = null;
  el.addEventListener('touchstart', e=>{ const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; }, {passive:true});
  el.addEventListener('touchend', e=>{
    if (x0 === null) return;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) (dx > 0 ? onPrev : onNext)();
  }, {passive:true});
}

/* Takvim üst başlığı: büyük başlık, alt satır, önceki/sonraki */
const calHead = (title, sub, extra='') => `<div class="calhead">
  <div><h1>${title}</h1><span class="sub">${sub}</span></div>
  <div class="side">${extra}
    <button class="rbtn sm" data-step="-1" aria-label="${T('Önceki','Previous')}">${ico('left')}</button>
    <button class="rbtn sm" data-step="1" aria-label="${T('Sonraki','Next')}">${ico('right')}</button></div></div>`;

/* Gün görünümü */
let dayFilter = 'all';     // 'all' = boş+dolu birlikte | 'busy' = yalnızca kayıt olan dersler
function calDay(){
  const dISO = iso(day);
  const todayISO = iso(new Date());
  const nowM = new Date().getHours()*60 + new Date().getMinutes();
  const hepsi = visible(classesOn(dISO));
  const ks = dayFilter==='busy'
    ? hepsi.filter(k=>takenOf(k) > 0)
    : hepsi;
  const bosSayi = hepsi.length - hepsi.filter(k=>takenOf(k) > 0).length;
  const closed = (DB.closed||[]).includes(dISO);
  const live = hepsi.filter(k=>!k.cancelled);
  let cap = 0, taken = 0;
  live.forEach(k=>{ cap += capOf(svc(k.serviceId)); taken += takenOf(k); });

  host().innerHTML = `
  ${calHead(`${TR_FULL[day.getDay()]} ${day.getDate()}`,
    `${fmtDate(day)} · ${live.length} ${T('ders','classes')} · ${T(`%${cap?Math.round(taken/cap*100):0} doluluk`,`${cap?Math.round(taken/cap*100):0}% full`)}`,
    dISO!==todayISO ? `<button class="today-link" data-step="0">${T('Bugün','Today')}</button>` : '')}
  <div class="seg small" style="margin-bottom:12px">
    <button class="${dayFilter==='all'?'on':''}" data-df="all">Tümü (${hepsi.length})</button>
    <button class="${dayFilter==='busy'?'on':''}" data-df="busy">Dolu dersler (${hepsi.length-bosSayi})</button>
  </div>
  ${closed?'<div class="hint alert"><b>Bu gün kapalı.</b> Üyeler bu günü görmüyor.</div>':''}
  <div id="dayswipe">
  ${ks.length ? ks.map(k=>{
      const s = svc(k.serviceId), cp = capOf(s);
      const bk = bookingsOf(k.key).filter(b=>b.status!=='waitlist');
      const wl = bookingsOf(k.key).filter(b=>b.status==='waitlist');
      const names = bk.slice(0,3).map(b=>firstN(mem(b.memberId)?.name)).join(', ');
      const pct = Math.min(100, Math.round(bk.length/cp*100));
      const past = dISO < todayISO || (dISO === todayISO && minutes(k.time) + (s?.dur||50) < nowM);
      if (k.cancelled) return `<div class="lcard off">
        <span class="ttile">${k.time}</span>
        <span class="lm"><b>${esc(s?.name)}</b><span>${k.timeoff
          ? esc((k.timeoff.trainerId==='all'?'stüdyo kapalı':trn(k.timeoff.trainerId)?.name+' izinli')
              + (k.timeoff.reason?` · ${k.timeoff.reason}`:''))
          : 'iptal edildi'}</span></span></div>`;
      return `<button class="lcard ${past?'past':''}" data-go="${k.key}">
        <span class="ttile">${k.time}</span>
        <span class="lm"><b>${esc(s?.name)}</b>
          <span>${bk.length
            ? esc(names)+(bk.length>3?` +${bk.length-3}`:'')
            : esc(trn(k.trainerId)?.name||'')+' · boş'}</span>
          <span class="fbar ${past?'past':''}"><i style="width:${pct}%"></i></span></span>
        <span class="lr"><b class="num">${bk.length}/${cp}</b>
          ${wl.length?`<span class="tag plum">+${wl.length}</span>`:''}</span></button>`;
    }).join('') : '<div class="card empty-note">Bu gün ders yok.</div>'}
  </div>
  <div class="calfoot">
    <button class="btn" id="once">Tek ders ekle</button>
    <button class="btn ${closed?'pri':'stop'}" id="shut">${
      closed?'Günü aç':'İzin / kapat'}</button></div>`;

  const step = v => { day = v===0 ? new Date() : addDays(day, v); route(); };
  document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>step(+b.dataset.step));
  bindSwipe($('#dayswipe'), ()=>step(-1), ()=>step(1));
  document.querySelectorAll('[data-df]').forEach(b=>b.onclick=()=>{ dayFilter=b.dataset.df; route(); });
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>classSheet(b.dataset.go));
  $('#once').onclick = () => onceModal(dISO);
  $('#shut').onclick = () => closed ? openDay(dISO) : timeoffModal();
}

          <button class="btn sm" data-wr="${w.id}">Çıkar</button></li>`).join('')}</ul></div>`:''}
      <div class="row" style="gap:8px;margin-top:18px">

    settleBooking(DB.bookings.find(y=>y.id===b.dataset.wr), 'cancelled');

  const al = $('#all'); if (al) al.onclick = () => {

    save(); closeAll(); route(); toast(`${n} kişi geldi olarak işaretlendi`); };
  $('#cx').onclick = () => { closeAll(); day = new Date(dISO+'T00:00:00'); cancelClass(sid, dISO); };

   · belirli bir eğitmen  · tüm stüdyo
   · tam gün / birkaç gün · gün içi saat aralığı

/* Bir dersin başlangıcı bir izne denk geliyor mu */
function timeoffFor(trainerId, dISO, time){
  const start = new Date(dISO+'T'+(time||'00:00')).getTime();
  return (DB.timeoff||[]).find(o=>{
    if (o.trainerId !== 'all' && o.trainerId !== trainerId) return false;
    return start >= new Date(o.from).getTime() && start < new Date(o.to).getTime();
  }) || null;
}

function timeoffLabel(o){
  const f = new Date(o.from), t = new Date(o.to);
  const who = o.trainerId === 'all' ? 'Tüm stüdyo' : (trn(o.trainerId)?.name || 'Eğitmen');
  const sameDay = iso(f) === iso(new Date(t.getTime()-60000));
  const hhmm2 = d => d.toLocaleTimeString(localeTag(),{hour:'2-digit',minute:'2-digit',hour12:false});
  const fullDay = hhmm2(f) === '00:00' && hhmm2(t) === '00:00';
  if (sameDay || (fullDay && iso(f) === iso(addDays(t,-1))))
    return `${who} · ${fmtDate(f)}${fullDay?' (tüm gün)':` ${hhmm2(f)}–${hhmm2(t)}`}`;
  return `${who} · ${fmtDate(f)} – ${fmtDate(addDays(t,-1))}${fullDay?'':` ${hhmm2(f)}–${hhmm2(t)}`}`;
}

/* İzin ekle — aralıktaki rezervasyonlar iptal edilir, kurala göre hak iade edilir */
function addTimeoff({ trainerId, from, to, reason }){
  const o = { id:uid(), trainerId, from, to, reason:reason||'', at:new Date().toISOString() };
  DB.timeoff.push(o);

  const ref = rules().refundStudioCancel;
  let cls = 0, bks = 0;
  for (let i=0; i<=370; i++){
    const d = addDays(new Date(from), i);
    const dISO = iso(d);
    if (new Date(dISO+'T00:00') >= new Date(to)) break;
    classesOn(dISO).forEach(k=>{
      if (k.cancelled && !timeoffFor(k.trainerId, dISO, k.time)) return;
      if (!timeoffFor(k.trainerId, dISO, k.time)) return;
      cls++;
      bookingsOf(k.key).forEach(b=>{
        settleBooking(b, 'cancelled', ref ? 'refund' : 'charge');
        bks++;
        if (b.memberId && mem(b.memberId)?.phone)
          DB.notify = (DB.notify||[]).concat([{ id:uid(), memberId:b.memberId,
            key:k.key, kind:'ders_iptal', at:new Date().toISOString() }]);
      });
    });
  }
  logAct('izin_eklendi', `${timeoffLabel(o)} · ${cls} ders, ${bks} rezervasyon iptal`,
         { kind:'timeoff', timeoffId:o.id });
  return { classes:cls, bookings:bks, id:o.id };
}

function removeTimeoff(id){
  const o = (DB.timeoff||[]).find(x=>x.id===id);
  DB.timeoff = (DB.timeoff||[]).filter(x=>x.id!==id);
  if (o) logAct('izin_kaldirildi', timeoffLabel(o));
  save(); route();
  toast('İzin kaldırıldı — iptal edilen rezervasyonlar geri gelmez');
}

/* İzin penceresi — hazır seçenekler + tarih/saat aralığı */
function timeoffModal(preTrainer){
  const TR_ALL = 'all';
  let who = preTrainer || (DB.trainers.length===1 ? DB.trainers[0].id : TR_ALL);
  let mode = 'day';                    // day | range | hours
  let d1 = iso(new Date()), d2 = iso(new Date());
  let h1 = '09:00', h2 = '13:00';
  let reason = '';

  const bounds = () => {
    if (mode === 'hours') return { from:`${d1}T${h1}`, to:`${d1}T${h2}` };
    if (mode === 'range') return { from:`${d1}T00:00`, to:`${iso(addDays(new Date(d2+'T00:00'),1))}T00:00` };
    return { from:`${d1}T00:00`, to:`${iso(addDays(new Date(d1+'T00:00'),1))}T00:00` };
  };

  /* Etkilenecek ders ve rezervasyon sayısını önceden say */
  const impact = () => {
    const { from, to } = bounds();
    let cls=0, bks=0;
    for (let i=0; i<=370; i++){
      const d = addDays(new Date(from), i), dISO = iso(d);
      if (new Date(dISO+'T00:00') >= new Date(to)) break;
      classesOn(dISO).filter(k=>!k.cancelled).forEach(k=>{
        if (who !== TR_ALL && k.trainerId !== who) return;
        const st = new Date(dISO+'T'+k.time).getTime();
        if (st < new Date(from).getTime() || st >= new Date(to).getTime()) return;
        cls++; bks += bookingsOf(k.key).length;
      });
    }
    return { cls, bks };
  };

  const render = () => {
    const im = impact();
    const modes = [['day','Tek gün'],['range','Tarih aralığı'],['hours','Saat aralığı']];
    $('#modal').innerHTML = `
    <div class="mhead"><div class="row sp">
      <div><div style="font-weight:600;font-size:16px">İzin / kapatma</div>
      <div class="lbl">Hastalık, izin veya özel durum</div></div>
      <button class="btn sm" data-close aria-label="Kapat">✕</button></div></div>
    <div class="mbody">

      <div class="field"><label>1 · Kim</label>
        <div class="chiprow">
          <button type="button" class="chip ${who===TR_ALL?'on':''}" data-w="${TR_ALL}">Tüm stüdyo</button>
          ${DB.trainers.map(t=>`<button type="button" class="chip ${who===t.id?'on':''}"
            data-w="${t.id}" aria-pressed="${who===t.id}">${esc(t.name)}</button>`).join('')}</div>
        <p class="lbl" style="margin:6px 0 0">${who===TR_ALL
          ? 'Stüdyo tamamen kapanır, bütün eğitmenlerin dersleri düşer.'
          : `Yalnızca ${esc(trn(who)?.name)} dersleri düşer, diğer eğitmenler çalışmaya devam eder.`}</p></div>

      <div class="field"><label>2 · Ne kadar</label>
        <div class="seg small">${modes.map(([k,l])=>
          `<button type="button" class="${mode===k?'on':''}" data-m="${k}">${l}</button>`).join('')}</div></div>

      ${mode==='day'?`
        <div class="field"><label for="d1">Gün</label><input id="d1" type="date" value="${d1}"></div>
        <div class="row" style="gap:6px;margin:-4px 0 12px;flex-wrap:wrap">
          <button type="button" class="btn sm" data-q="0">Bugün</button>
          <button type="button" class="btn sm" data-q="1">Yarın</button>
          <button type="button" class="btn sm" data-q="week">Bu hafta</button>
          <button type="button" class="btn sm" data-q="nextweek">Gelecek hafta</button></div>`
      : mode==='range'?`
        <div class="row" style="gap:10px">
          <div class="field" style="flex:1"><label for="d1">Başlangıç</label>
            <input id="d1" type="date" value="${d1}"></div>
          <div class="field" style="flex:1"><label for="d2">Bitiş</label>
            <input id="d2" type="date" value="${d2}"></div></div>
        <div class="row" style="gap:6px;margin:-4px 0 12px;flex-wrap:wrap">
          <button type="button" class="btn sm" data-q="week">Bu hafta</button>
          <button type="button" class="btn sm" data-q="nextweek">Gelecek hafta</button>
          <button type="button" class="btn sm" data-q="2w">2 hafta</button></div>`
      :`
        <div class="field"><label for="d1">Gün</label><input id="d1" type="date" value="${d1}"></div>
        <div class="row" style="gap:10px">
          <div class="field" style="flex:1"><label for="h1">Başlangıç saati</label>
            <input id="h1" type="time" value="${h1}"></div>
          <div class="field" style="flex:1"><label for="h2">Bitiş saati</label>
            <input id="h2" type="time" value="${h2}"></div></div>`}

      <div class="field"><label for="rs">Sebep (isteğe bağlı)</label>
        <input id="rs" value="${esc(reason)}" placeholder="Hastalık, izin, eğitim…"></div>

      <div class="stsum ${im.bks?'warnbox':''}">
        <div class="row sp"><span>Düşecek ders</span><b>${im.cls}</b></div>
        <div class="row sp"><span>İptal edilecek rezervasyon</span><b>${im.bks}</b></div>
        ${im.bks?`<div class="row sp"><span>Haklar</span>
          <b>${rules().refundStudioCancel?'iade edilecek':'yanacak (Ayarlar\'dan değiştirilebilir)'}</b></div>`:''}
      </div>

      <button class="btn stop" id="ok" style="width:100%;margin-top:14px">
        ${im.cls?`${im.cls} dersi kapat`:'Kapat'}</button>
    </div>`;

    $('#modal').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeAll);
    $('#modal').querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{ who=b.dataset.w; render(); });
    $('#modal').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ mode=b.dataset.m; render(); });
    $('#modal').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{
      const q = b.dataset.q;
      const mon = addDays(new Date(), -((new Date().getDay()+6)%7));
      if (q==='0'){ mode='day'; d1=iso(new Date()); }
      else if (q==='1'){ mode='day'; d1=iso(addDays(new Date(),1)); }
      else if (q==='week'){ mode='range'; d1=iso(new Date()); d2=iso(addDays(mon,6)); }
      else if (q==='nextweek'){ mode='range'; d1=iso(addDays(mon,7)); d2=iso(addDays(mon,13)); }
      else if (q==='2w'){ mode='range'; d1=iso(new Date()); d2=iso(addDays(new Date(),13)); }
      render(); });
    const g = id => $('#'+id);
    if (g('d1')) g('d1').onchange = e => { d1 = e.target.value; if (d2<d1) d2=d1; render(); };
    if (g('d2')) g('d2').onchange = e => { d2 = e.target.value; render(); };
    if (g('h1')) g('h1').onchange = e => { h1 = e.target.value; render(); };
    if (g('h2')) g('h2').onchange = e => { h2 = e.target.value; render(); };
    if (g('rs')) g('rs').oninput = e => { reason = e.target.value; };

    bindLock('#ok', ()=>{
      const { from, to } = bounds();
      if (new Date(to) <= new Date(from)) return toast('Bitiş, başlangıçtan sonra olmalı', true);
      const r = addTimeoff({ trainerId:who, from, to, reason });
      save(); closeAll(); route();
      toast(r.bookings
        ? `Kapatıldı · ${r.classes} ders, ${r.bookings} rezervasyon iptal edildi`
        : `Kapatıldı · ${r.classes} ders düştü`);
    });
  };
  openModal('<div class="mbody"></div>');
  render();
}

        return `<div class="lrow">

            <span class="lbl">${esc(o.reason||'sebep yazılmadı')}${aktif?' · şu an aktif':''}</span></span>

/* =====================================================================
   GÜN / HAFTA KAPATMA
   Tatil, rapor, bayram. Kapatılan günün dersleri düşer,
   kayıtlı herkesin hakkı iade edilir.
   ===================================================================== */
function refundDay(dISO){
  let n = 0;
  classesOn(dISO).forEach(k=>{
    const ref = rules().refundStudioCancel;
    bookingsOf(k.key).forEach(b=>{
      settleBooking(b, 'cancelled', ref ? 'refund' : 'charge'); n++;
    });
  });
  return n;
}

function closeDay(dISO, silent){
  if ((DB.closed||[]).includes(dISO)) return 0;
  const n = refundDay(dISO);
  DB.closed.push(dISO);
  if (!silent){ save(); route();
    toast(n ? `Gün kapatıldı, ${n} kişinin hakkı iade edildi` : 'Gün kapatıldı'); }
  return n;
}

function openDay(dISO){
  DB.closed = (DB.closed||[]).filter(x=>x!==dISO);
  save(); route(); toast('Gün yeniden açıldı — iptal edilen kayıtlar geri gelmez');
}

function askCloseDay(dISO){
  const d = new Date(dISO+'T00:00:00');
  const n = classesOn(dISO).filter(k=>!k.cancelled)
    .reduce((s,k)=>s+bookingsOf(k.key).length, 0);
  openModal(`<div class="mhead"><div class="row sp">
      <div><div style="font-weight:600;font-size:16px">Günü kapat</div>
      <div class="lbl">${TR_FULL[d.getDay()]} ${fmtDate(d)}</div></div>
      <button class="btn sm" data-close>Vazgeç</button></div></div>
    <div class="mbody">
      <p style="margin:0 0 14px">${n
        ? `Bu güne <b>${n} kayıt</b> var. Kapatırsan hepsinin hakkı geri yüklenir ve
           öğrenciler bu günü hiç görmez.`
        : 'Bu güne kayıt yok. Kapatırsan öğrenciler bu günü görmez.'}</p>
      <button class="btn stop" id="ok" style="width:100%">Günü kapat</button></div>`);
  $('#ok').onclick = () => { closeAll(); closeDay(dISO); };
}

/* Tek dersi iptal et — o günün o saati düşer, kayıtlıların hakkı kurala
   göre iade edilir (Ayarlar › Stüdyo iptalinde hak iade edilsin). */
function cancelClass(sid, dISO){
  dISO = dISO || iso(day);
  const ser = DB.series.find(x=>x.id===sid) || (DB.extra||[]).find(x=>x.id===sid);
  if (!ser) return toast(T('Ders bulunamadı','Class not found'), true);
  const key = sid+'|'+dISO;
  const n = bookingsOf(key).filter(b=>b.status!=='waitlist').length;
  const ref = rules().refundStudioCancel;
  openModal(`<div class="mhead"><div class="row sp">
      <div><div style="font-weight:600;font-size:16px">Dersi iptal et</div>
      <div class="lbl">${esc(svc(ser.serviceId)?.name||'')} · ${fmtDate(new Date(dISO+'T00:00:00'))} ${ser.time}</div></div>
      <button class="btn sm" data-close>Vazgeç</button></div></div>
    <div class="mbody">
      <p style="margin:0 0 14px">${n
        ? T(`Bu derste <b>${n} kayıt</b> var. İptal edersen ${ref
              ? 'hepsinin hakkı geri yüklenir.' : 'kurala göre hakları yanar.'}`,
            `<b>${n} bookings</b> in this class. If you cancel, ${ref
              ? 'everyone gets their credit back.' : 'credits are charged per your rules.'}`)
        : T('Bu derse kayıt yok. İptal edersen öğrenciler bu dersi görmez.',
            'No one is booked. If you cancel, members will not see this class.')}</p>
      <button class="btn stop" id="ok" style="width:100%">Dersi iptal et</button></div>`);
  $('#ok').onclick = () => {
    closeAll();
    let bks = 0;
    bookingsOf(key).forEach(b=>{
      settleBooking(b, 'cancelled', ref ? 'refund' : 'charge');
      bks++;
      if (b.memberId && mem(b.memberId)?.phone)
        DB.notify = (DB.notify||[]).concat([{ id:uid(), memberId:b.memberId,
          key, kind:'ders_iptal', at:new Date().toISOString() }]);
    });
    DB.off = DB.off || [];
    if (!DB.off.some(o=>o.seriesId===sid && o.date===dISO))
      DB.off.push({ seriesId:sid, date:dISO });
    logAct('class_cancelled',
      `${svc(ser.serviceId)?.name||''} · ${fmtDate(new Date(dISO+'T00:00:00'))} ${ser.time} · ${bks} rezervasyon iptal`,
      { kind:'class_cancel', seriesId:sid, date:dISO });
    save(); route();
    toast(bks ? T(`Ders iptal edildi, ${bks} kayıt düştü`, `Class cancelled, ${bks} bookings removed`)
              : T('Ders iptal edildi','Class cancelled'));
  };
}

function askCloseWeek(mondayISO){
  const start = new Date(mondayISO+'T00:00:00');
  const days = Array.from({length:7},(_,i)=>iso(addDays(start,i)));
  const n = days.reduce((s,dd)=>s+classesOn(dd).filter(k=>!k.cancelled)
    .reduce((a,k)=>a+bookingsOf(k.key).length,0), 0);
  const already = days.every(dd=>(DB.closed||[]).includes(dd));

  openModal(`<div class="mhead"><div class="row sp">
      <div><div style="font-weight:600;font-size:16px">${already?'Haftayı aç':'Haftayı kapat'}</div>
      <div class="lbl">${fmtDate(start)} – ${fmtDate(addDays(start,6))}</div></div>
      <button class="btn sm" data-close>Vazgeç</button></div></div>
    <div class="mbody">
      <p style="margin:0 0 14px">${already
        ? 'Bu haftanın tamamı kapalı. Açarsan dersler tekrar görünür; iptal edilen kayıtlar geri gelmez.'
        : n ? `Bu haftaya <b>${n} kayıt</b> var. Tatil için kapatırsan hepsinin hakkı geri yüklenir.`
            : 'Bu haftaya kayıt yok.'}</p>
      <button class="btn ${already?'pri':'stop'}" id="ok" style="width:100%">
        ${already?'Haftayı aç':'Tüm haftayı kapat'}</button></div>`);
  $('#ok').onclick = () => {
    closeAll();
    if (already){ DB.closed = (DB.closed||[]).filter(x=>!days.includes(x)); save(); route();
      toast('Hafta açıldı'); }
    else { let t = 0; days.forEach(dd=>{ t += closeDay(dd, true); });
      save(); route(); toast(t ? `Hafta kapatıldı, ${t} kayıt iade edildi` : 'Hafta kapatıldı'); }
  };
}

/* =====================================================================
   AY — takvim görünümü
   ===================================================================== */
let monthRef = new Date();
let monthSel = null;      // seçili gün (ISO) — yalnızca görünüm

function viewMonth(){
  const y = monthRef.getFullYear(), mo = monthRef.getMonth();
  const first = new Date(y, mo, 1);
  const start = addDays(first, -((first.getDay()+6)%7));
  const weeks = Math.ceil((((first.getDay()+6)%7) + new Date(y, mo+1, 0).getDate()) / 7);
  const cells = Array.from({length:weeks*7},(_,i)=>addDays(start,i));
  const todayISO = iso(new Date());
  if (!monthSel || monthSel.slice(0,7) !== iso(first).slice(0,7))
    monthSel = todayISO.slice(0,7) === iso(first).slice(0,7) ? todayISO : iso(first);

  let monthClasses = 0, monthBooked = 0, monthCap = 0;
  const html = cells.map(d=>{
    const dISO = iso(d);
    const out = d.getMonth() !== mo;
    const closed = (DB.closed||[]).includes(dISO);
    const ks = visible(classesOn(dISO)).filter(k=>!k.cancelled);
    let cap = 0, taken = 0;
    ks.forEach(k=>{ cap += capOf(svc(k.serviceId)); taken += takenOf(k); });
    if (!out){ monthClasses += ks.length; monthBooked += taken; monthCap += cap; }
    const fc = closed ? 'closed' : ks.length ? fillClass(taken, cap) : '';
    return `<button class="mday ${fc} ${out?'out':''} ${dISO<todayISO?'past':''} ${dISO===todayISO?'today':''} ${dISO===monthSel?'sel':''}"
        data-d="${dISO}" aria-label="${fmtDate(d)}${closed?' · '+T('kapalı','closed'):ks.length?` · ${ks.length} ${T('ders','classes')} · ${taken}/${cap}`:''}">
      ${d.getDate()}</button>`;
  }).join('');

  /* seçili günün kısa listesi */
  const sd = new Date(monthSel+'T00:00:00');
  const sClosed = (DB.closed||[]).includes(monthSel);
  const sks = visible(classesOn(monthSel));
  const pct = monthCap ? Math.round(monthBooked/monthCap*100) : 0;

  host().innerHTML = `${calHead(`${MONTH_FULL()[mo]} ${y}`,
      `${monthClasses} ${T('ders','classes')} · ${T(`%${pct} doluluk`,`${pct}% full`)}`,
      iso(first).slice(0,7) !== todayISO.slice(0,7) ? `<button class="today-link" data-step="0">${T('Bu ay','This month')}</button>` : '')}
  <div class="sgwrap" id="mswipe" style="padding:12px 10px">
    <div class="mgrid">
      ${[1,2,3,4,5,6,0].map(w=>`<span class="mh">${TR_DAY[w]}</span>`).join('')}
      ${html}</div></div>
  ${legendHtml()}

  <div class="sech">${TR_FULL[sd.getDay()]} ${fmtDate(sd)}<small>${sClosed ? T('kapalı','closed')
    : `${sks.filter(k=>!k.cancelled).length} ${T('ders','classes')}`}</small></div>
  ${sks.length ? `<div class="list mlist">${sks.map(k=>{
      const sv = svc(k.serviceId), cp = capOf(sv), n = takenOf(k);
      return k.cancelled
        ? `<div class="urow"><span class="ttile" style="background:var(--c-surface-mute);color:var(--c-text-2)">${k.time}</span>
            <span class="um"><b style="color:var(--c-text-2)">${esc(sv?.name)}</b><span>${T('kapalı','closed')}</span></span></div>`
        : `<button class="urow" data-go="${k.key}"><span class="ttile">${k.time}</span>
            <span class="um"><b>${esc(sv?.name)}</b><span>${esc(trn(k.trainerId)?.name||'')}</span></span>
            <span class="ur"><b class="amt num">${n}/${cp}</b></span></button>`;
    }).join('')}</div>` : `<div class="card empty-note">${T('Bu gün ders yok.','No classes on this day.')}</div>`}
  <div class="calfoot">
    ${sClosed ? `<button class="btn pri" id="mopen">${T('Günü aç','Open the day')}</button>`
              : `<button class="btn stop" id="mshut">${T('Günü kapat','Close the day')}</button>`}
    <button class="btn" id="monce">Tek ders ekle</button>
    <button class="btn" id="mgo">${T('Gün görünümü','Day view')}</button></div>`;

  const step = v => { monthRef = v===0 ? new Date() : new Date(y, mo+v, 1); monthSel = null; route(); };
  document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>step(+b.dataset.step));
  bindSwipe($('#mswipe'), ()=>step(-1), ()=>step(1));
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
    if (b.dataset.d.slice(0,7) !== iso(first).slice(0,7)){ monthRef = new Date(b.dataset.d+'T00:00:00'); }
    monthSel = b.dataset.d; viewMonth(); });
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>classSheet(b.dataset.go));
  const sh = $('#mshut'); if (sh) sh.onclick = () => askCloseDay(monthSel);
  const op = $('#mopen'); if (op) op.onclick = () => openDay(monthSel);
  $('#monce').onclick = () => onceModal(monthSel);
  $('#mgo').onclick = () => { day = new Date(monthSel+'T00:00:00'); calTab = 'day'; route(); };
}

const legendHtml = () => `<div class="legend2" aria-hidden="true">
  <span><i class="lg0"></i>${T('az','low')}</span><span><i class="lg1"></i>${T('orta','medium')}</span>
  <span><i class="lg2"></i>${T('yoğun','busy')}</span><span><i class="lg3"></i>${T('dolu','full')}</span>
  <span><i class="lgx"></i>${T('kapalı','closed')}</span></div>`;

/* =====================================================================
   HAFTA
   ===================================================================== */
let weekSel = null;        // seçili hücre "tarih|satır" — yalnızca görünüm

function viewWeek(){
  const monday = addDays(day, -((day.getDay()+6)%7));
  const days = Array.from({length:7},(_,i)=>addDays(monday,i));
  const dISOs = days.map(iso);
  const todayISO = iso(new Date());

  /* Satırlar = ders programındaki sabit saat slotları (saat + ders tipi).
     Haftalık seriden ve bu haftanın tek seferlik derslerinden dinamik üretilir. */
  const vis = x => trainerFilter==='all' || x.trainerId===trainerFilter;
  const rowMap = new Map();
  [...DB.series.filter(vis), ...(DB.extra||[]).filter(e=>dISOs.includes(e.date)).filter(vis)]
    .forEach(x=>{ const id = x.time+'|'+x.serviceId;
      if (!rowMap.has(id)) rowMap.set(id, { id, time:x.time, serviceId:x.serviceId }); });
  const rows = [...rowMap.values()].sort((a,b)=>a.time.localeCompare(b.time)
    || String(svc(a.serviceId)?.name).localeCompare(String(svc(b.serviceId)?.name),'tr'));

  /* Hücre durumu */
  const byDay = {};
  dISOs.forEach(d=>{ byDay[d] = visible(classesOn(d)); });
  let wkClasses = 0, wkCap = 0, wkTaken = 0;
  dISOs.forEach(d=>byDay[d].filter(k=>!k.cancelled).forEach(k=>{
    wkClasses++; wkCap += capOf(svc(k.serviceId)); wkTaken += takenOf(k); }));
  const cellOf = (dISO, r) => {
    const wd = new Date(dISO+'T00:00:00').getDay();
    const ks = byDay[dISO].filter(k=>k.time===r.time && k.serviceId===r.serviceId);
    const offSeries = DB.series.filter(x=>vis(x) && x.weekday===wd && x.time===r.time
      && x.serviceId===r.serviceId && x.off);
    const dayClosed = (DB.closed||[]).includes(dISO);
    if (ks.length){
      const liveK = ks.filter(k=>!k.cancelled);
      if (!liveK.length) return { st:'closed', ks,
        label: ks.some(k=>k.dayClosed||k.timeoff) ? T('kapalı','closed') : T('iptal','cancelled') };
      let n = 0, cp = 0; liveK.forEach(k=>{ n += takenOf(k); cp += capOf(svc(k.serviceId)); });
      return { st:'open', ks:liveK, n, cp };
    }
    if (offSeries.length || (dayClosed && DB.series.some(x=>vis(x) && x.weekday===wd && x.time===r.time && x.serviceId===r.serviceId)))
      return { st:'closed', ks:[], offSeries, dayClosed, label:T('kapalı','closed') };
    return { st:'none' };
  };

  const head = `<span></span>` + days.map((d,i)=>`<button class="sg-hd ${dISOs[i]===todayISO?'today':''} ${dISOs[i]<todayISO?'past':''}"
      data-wd="${dISOs[i]}" aria-label="${TR_FULL[d.getDay()]} ${fmtDate(d)}">
      <small>${TR_DAY[d.getDay()]}</small><b>${d.getDate()}</b></button>`).join('');
  const body = rows.map(r=>`<div class="sg-tm"><b>${r.time}</b><small>${esc(shortSvc(svc(r.serviceId)?.name))}</small></div>`
    + dISOs.map(dISO=>{
      const c = cellOf(dISO, r), id = dISO+'|'+r.id, past = dISO < todayISO;
      const sel = weekSel === id ? 'sel' : '';
      if (c.st === 'none') return `<span class="slot none" aria-hidden="true">–</span>`;
      if (c.st === 'closed') return `<button class="slot closed ${sel}" data-cell="${id}"
          aria-label="${fmtDate(new Date(dISO+'T00:00:00'))} ${r.time} · ${c.label}"><span class="c">${c.label}</span></button>`;
      return `<button class="slot ${fillClass(c.n, c.cp)} ${past?'past':''} ${sel}" data-cell="${id}"
          aria-label="${fmtDate(new Date(dISO+'T00:00:00'))} ${r.time} · ${c.n}/${c.cp}">
        <span class="n">${c.n}</span><span class="c">/${c.cp}</span></button>`;
    }).join('')).join('');

  const pct = wkCap ? Math.round(wkTaken/wkCap*100) : 0;
  const thisWeek = dISOs.includes(todayISO);
  host().innerHTML = `${calHead(`${fmtDate(days[0])} – ${fmtDate(days[6])}`,
      `${wkClasses} ${T('ders','classes')} · ${T(`%${pct} doluluk`,`${pct}% full`)}`,
      thisWeek ? '' : `<button class="today-link" data-step="0">${T('Bu hafta','This week')}</button>`)}
    ${DB.trainers.length>1 ? `<div class="fchips">
      <button class="fchip ${trainerFilter==='all'?'on':''}" data-tf="all" aria-pressed="${trainerFilter==='all'}">Tümü</button>
      ${DB.trainers.map(t=>`<button class="fchip ${trainerFilter===t.id?'on':''}"
        data-tf="${t.id}" aria-pressed="${trainerFilter===t.id}">${esc(t.name)}</button>`).join('')}</div>`:''}
    ${!rows.length
      ? `<div class="card empty-note">Ders programın henüz boş.<br>
          <button class="btn pri" id="goprog" style="margin-top:12px">${T('Ders programını kur','Set up the schedule')}</button></div>`
      : `<div class="sgwrap" id="wswipe"><div class="sgrid">${head}${body}</div></div>
         ${legendHtml()}
         <div id="wdetail"></div>`}
    <div class="calfoot"><button class="btn stop" data-cw>Haftayı kapat</button></div>`;

  /* Detay kartı — hücreye dokununca altta açılır */
  const showDetail = id => {
    const [dISO, time, serviceId] = id.split('|');
    const r = rowMap.get(time+'|'+serviceId); const c = r ? cellOf(dISO, r) : { st:'none' };
    const d = new Date(dISO+'T00:00:00');
    const sv = svc(serviceId);
    const endT = t => { const m = minutes(t) + (sv?.dur||50);
      return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`; };
    const over = `${TR_FULL[d.getDay()]} ${d.getDate()} · ${time}–${endT(time)}`;
    const box = $('#wdetail'); if (!box) return;
    if (c.st === 'closed'){
      const k = c.ks[0];
      box.innerHTML = `<div class="dcardx"><div class="top"><span class="over">${over}</span></div>
        <h3>${esc(sv?.name)} · ${c.label}</h3>
        <p class="empty">${c.dayClosed || k?.dayClosed ? T('Bu gün kapalı. Üyeler bu günü görmüyor.','This day is closed. Members cannot see it.')
          : k?.timeoff ? T('Bu saat bir izne denk geliyor.','This time falls into a time off.')
          : c.offSeries?.length ? T('Bu haftalık saat kapalı.','This weekly time is closed.')
          : T('Bu ders iptal edildi.','This class was cancelled.')}</p>
        <div class="acts">${(c.dayClosed || k?.dayClosed) ? `<button class="btn pri" id="dopen">${T('Günü aç','Open the day')}</button>`
          : k?.timeoff ? `<button class="btn pri" id="dtime">${T('İzinleri gör','See time off')}</button>`
          : c.offSeries?.length ? `<button class="btn pri" id="dslot">${T('Saati aç','Open the time')}</button>` : ''}
          <button class="btn" id="dday">${T('Gün görünümü','Day view')}</button></div></div>`;
      const o1 = $('#dopen'); if (o1) o1.onclick = () => openDay(dISO);
      const o2 = $('#dtime'); if (o2) o2.onclick = () => timeoffSheet();
      const o3 = $('#dslot'); if (o3) o3.onclick = () => slotEdit(c.offSeries[0].id);
    } else if (c.st === 'open'){
      box.innerHTML = c.ks.map(k=>{
        const bk = bookingsOf(k.key).filter(b=>b.status!=='waitlist');
        const wl = bookingsOf(k.key).filter(b=>b.status==='waitlist');
        const cp = capOf(svc(k.serviceId));
        return `<div class="dcardx"><div class="top"><span class="over">${over}</span>
            <span class="cnt num">${bk.length}<small>/${cp}</small></span></div>
          <h3>${esc(sv?.name)} · ${esc(trn(k.trainerId)?.name||'')}</h3>
          ${bk.length||wl.length ? `<div class="pchips">${bk.map(b=>`<span class="pchip">${esc(shortN(mem(b.memberId)?.name))}</span>`).join('')}
            ${wl.map(b=>`<span class="pchip wait">${esc(shortN(mem(b.memberId)?.name))} · ${T('sırada','waiting')}</span>`).join('')}</div>`
            : `<p class="empty">${T('Henüz katılımcı yok.','No one booked yet.')}</p>`}
          <div class="acts"><button class="btn pri" data-dbook="${k.key}">${T('Rezervasyon ekle','Add booking')}</button>
            <button class="btn" data-dsheet="${k.key}">${T('Yoklama','Attendance')}</button></div></div>`;
      }).join('');
      box.querySelectorAll('[data-dbook]').forEach(b=>b.onclick=()=>bookModal(b.dataset.dbook));
      box.querySelectorAll('[data-dsheet]').forEach(b=>b.onclick=()=>classSheet(b.dataset.dsheet));
    } else box.innerHTML = '';
    const dd = $('#dday'); if (dd) dd.onclick = () => { day = d; calTab = 'day'; route(); };
  };

  const step = v => { day = v===0 ? new Date() : addDays(day, v*7); weekSel = null; route(); };
  document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>step(+b.dataset.step));
  bindSwipe($('#wswipe'), ()=>step(-1), ()=>step(1));
  document.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>{ trainerFilter=b.dataset.tf; weekSel=null; route(); });
  document.querySelectorAll('[data-cw]').forEach(b=>b.onclick=()=>askCloseWeek(iso(monday)));
  const gp = $('#goprog'); if (gp) gp.onclick = () => { nav = 'program'; route(); };
  /* gün başlığı → o günün görünümü */
  document.querySelectorAll('[data-wd]').forEach(b=>b.onclick=()=>{
    day = new Date(b.dataset.wd+'T00:00:00'); calTab='day'; route(); });
  /* hücre: dokun → seç ve detay; uzun bas → haftalık saati kapat/aç */
  document.querySelectorAll('[data-cell]').forEach(b=>{
    let timer = null, longed = false;
    const cancel = () => { clearTimeout(timer); timer = null; };
    b.addEventListener('pointerdown', ()=>{ longed = false;
      timer = setTimeout(()=>{ longed = true;
        const [dISO, time, serviceId] = b.dataset.cell.split('|');
        const wd = new Date(dISO+'T00:00:00').getDay();
        const ser = DB.series.find(x=>x.weekday===wd && x.time===time && x.serviceId===serviceId && vis(x));
        if (ser) slotEdit(ser.id);
        else if ((DB.closed||[]).includes(dISO)) openDay(dISO);
      }, 550); });
    ['pointerup','pointerleave','pointercancel'].forEach(e=>b.addEventListener(e, cancel));
    b.addEventListener('contextmenu', e=>e.preventDefault());
    b.onclick = () => { if (longed) return;
      document.querySelectorAll('.slot.sel').forEach(x=>x.classList.remove('sel'));
      weekSel = weekSel === b.dataset.cell ? null : b.dataset.cell;
      if (weekSel){ b.classList.add('sel'); showDetail(weekSel);
        const box = $('#wdetail'); if (box && box.scrollIntoView) box.scrollIntoView({behavior:'smooth', block:'nearest'}); }
      else { const box = $('#wdetail'); if (box) box.innerHTML = ''; } };
  });
  if (weekSel && dISOs.includes(weekSel.split('|')[0])) showDetail(weekSel); else weekSel = null;
}

/* =====================================================================
   ÜYELER
   ===================================================================== */
let memQ = '';
let memFilter = 'all';      // 'all' | 'ending' | 'debt' | 'passive' — yalnızca görünüm filtresi
const initials = n => String(n||'').trim().split(/\s+/).slice(0,2)
  .map(x=>x[0]||'').join('').toLocaleUpperCase('tr');
/* Avatar rengi üyeye sabit: lavanta / adaçayı / şeftali / gök sırayla */
const avClass = id => 'c' + (DB.members.findIndex(m=>m.id===id) % 4 + 4) % 4;

function viewMembers(){
  const todayISO = iso(new Date()), now = new Date();
  const q = memQ.toLocaleLowerCase('tr');
  const info = DB.members.map(m=>{
    const p = anyPlan(m.id), l = left(p);
    const valid = planValid(p, todayISO) && l > 0;
    const ending = valid && (l <= 2 || (p.expires && (new Date(p.expires) - now)/86400000 <= 14));
    const debt = DB.plans.filter(x=>x.memberId===m.id && x.status==='active' && x.price>x.paid)
      .reduce((a,x)=>a+(x.price-x.paid),0);
    return { m, p, l, valid, ending, debt };
  });
  const cnt = { all:info.length, ending:info.filter(x=>x.ending).length,
                debt:info.filter(x=>x.debt>0).length, passive:info.filter(x=>!x.valid).length };
  const active = info.length - cnt.passive;
  const shown = info.filter(x=>{
    if (memFilter==='ending' && !x.ending) return false;
    if (memFilter==='debt' && !(x.debt>0)) return false;
    if (memFilter==='passive' && x.valid) return false;
    return !q || x.m.name.toLocaleLowerCase('tr').includes(q) || String(x.m.phone||'').includes(q);
  });

  const rows = shown.map(({m,p,l,ending,debt})=>`<button class="urow" data-open="${m.id}">
      <span class="av ${avClass(m.id)}" aria-hidden="true">${esc(initials(m.name))}</span>
      <span class="um"><b>${esc(m.name)}</b>
        <span>${p ? `${esc(p.name)} · ${fmtDate(new Date(p.expires))}` : T('Paket yok','No package')}</span></span>
      <span class="ur">${p ? `<b>${l}<small>/${p.total}</small></b>` : ''}
        ${ending ? `<span class="tag warn">${T('bitiyor','ending')}</span>`
          : debt ? `<span class="tag warn">${money(debt)}</span>` : ''}</span></button>`).join('');

  const chip = (k, l, cls='') => `<button class="fchip ${cls} ${memFilter===k?'on':''}" data-mf="${k}"
    aria-pressed="${memFilter===k}">${l}${k!=='all'&&cnt[k]?` <span class="n">${cnt[k]}</span>`:''}</button>`;

  $('#view').innerHTML = `<div class="shead">
    <div><h1 class="disp">${T('Üyeler','Members')}</h1></div>
    <div class="side"><span class="count">${active} ${T('aktif','active')}</span>
      <button class="btn onlywide" data-sell>Paket sat</button>
      <button class="btn pri onlywide" data-new>Üye ekle</button></div></div>
    ${DB.members.length ? `
    <label class="search">${ico('search')}<input id="mq" type="search" placeholder="Ad veya telefon ara…"
      value="${esc(memQ)}" aria-label="Ad veya telefon ara…"></label>
    <div class="fchips">
      ${chip('all', T('Tümü','All'))}${chip('ending', T('Bitiyor','Ending'), 'warn')}
      ${chip('debt', T('Borçlu','Owes'))}${chip('passive', T('Pasif','Inactive'))}</div>
    ${rows ? `<div class="list">${rows}</div>`
      : `<div class="card empty-note">${T('Bu filtrede üye yok.','No members match this filter.')}</div>`}`
    : `<div class="card empty-note">Henüz üye yok.<br>
       <button class="btn pri" data-new style="margin-top:12px">İlk üyeyi ekle</button></div>`}`;
  const mq = $('#mq');
  if (mq){ mq.oninput = () => { memQ = mq.value; const pos = mq.selectionStart; route();
    const el = $('#mq'); if (el){ el.focus(); el.setSelectionRange(pos,pos); } }; }
  document.querySelectorAll('[data-mf]').forEach(b=>b.onclick=()=>{ memFilter = b.dataset.mf; route(); });
  document.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>startMemberChain());
  document.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>sellModal());
  document.querySelectorAll('[data-open]').forEach(r=>r.onclick=()=>openMember(r.dataset.open));
}

function memberModal(opts={}){
  openModal(`<div class="mhead"><div class="row sp">
      <div style="font-weight:600;font-size:16px">Üye ekle</div>
      <button class="btn sm" data-close>Kapat</button></div></div>
    <div class="mbody">
      <div class="field"><label for="nm">Ad soyad</label>
        <input id="nm" autocomplete="name" value="${esc(opts.prefill||'')}"></div>
      <div class="field"><label for="ph">Telefon</label>
        <input id="ph" type="tel" inputmode="numeric" placeholder="0532 000 00 00" autocomplete="tel"></div>
      <div class="field"><label for="nt">Not (sakatlık, dikkat edilecekler)</label><input id="nt"></div>
      <button class="btn pri" id="save" style="width:100%">Kaydet</button></div>`);
  bindLock('#save', () => {
    const n = $('#nm').value.trim();
    if (!n) return toast('Ad soyad gerekli', true);
    const raw = $('#ph').value.trim();
    let phone = '';
    if (raw){
      phone = normPhone(raw);
      if (!phone) return toast(phoneHint(), true);
      const dup = DB.members.find(m=>m.phone === phone);
      if (dup) return toast(`Bu numara zaten kayıtlı: ${dup.name}`, true);
    }
    const sameName = DB.members.find(m=>m.name.toLocaleLowerCase('tr') === n.toLocaleLowerCase('tr'));
    if (sameName && !phone)
      return toast(`${n} zaten kayıtlı. Ayırt etmek için telefon gir.`, true);

    DB.members.push({ id:uid(), name:n, phone, note:$('#nt').value.trim(),
                      createdAt: iso(new Date()) });
    const newId = DB.members[DB.members.length-1].id;
    logAct('uye_eklendi', n, { kind:'member', memberId:newId });
    save(); closeAll();
    if (opts.onDone) opts.onDone(newId);
    else { route(); toast('Üye eklendi'); }
  });
}

const PAY_METHODS = [['cash','Nakit'],['card','Kredi kartı'],['transfer','Havale/EFT'],['other','Diğer']];
const payLabel = m => (PAY_METHODS.find(x=>x[0]===m)||['','—'])[1];

/* Paket satışı — finansal işlem, tek tıkla tamamlanmaz.
   Üye > paket > tarih > fiyat > indirim > tahsilat > yöntem > vade > özet > onay */
function sellModal(preId, onDone){
  if (!DB.members.length) return toast('Önce üye ekle', true);
  if (!DB.packages.length) return toast('Önce Ayarlar\'dan paket tanımla', true);

  const F = { memberId: preId || DB.members[0].id, pkgId:null, start:iso(new Date()),
              discount:0, collected:0, method:'cash', dueDate:'' };

  const render = () => {
    const pkg = DB.packages.find(x=>x.id===F.pkgId);
    const list = pkg ? pkg.price : 0;
    const net  = Math.max(list - (F.discount||0), 0);
    const due  = Math.max(net - (F.collected||0), 0);
    const exp  = pkg ? iso(addDays(new Date(F.start+'T00:00:00'), pkg.days)) : null;
    const m    = mem(F.memberId);
    const existing = anyPlan(F.memberId);

    $('#modal').innerHTML = `
    <div class="mhead"><div class="row sp">
      <div><div style="font-weight:600;font-size:16px">Yeni paket satışı</div>
      <div class="lbl">${pkg ? esc(pkg.name)+' · '+money(net) : 'Paket seç'}</div></div>
      <button class="btn sm" data-close aria-label="Kapat">✕</button></div></div>
    <div class="mbody">

      <div class="field"><label>1 · Üye</label>
        <button type="button" class="combo" id="who">
          <span><b>${esc(m.name)}</b><span class="lbl">${
            showPhone(m.phone)||'telefon yok'}${existing?` · ${left(existing)} hak`:''}</span></span>
          <span class="chev">›</span></button>
        ${existing ? `<p class="lbl" style="margin:5px 0 0">Bu üyenin aktif paketi var:
          ${esc(existing.name)}, ${left(existing)} hak. Yeni satış eskisini kapatır.</p>`:''}</div>

      <div class="field"><label>2 · Paket</label>
        ${DB.packages.map(p=>`<button type="button" class="pick ${F.pkgId===p.id?'sel':''}" data-p="${p.id}">
          <span><span class="nm">${esc(p.name)}</span><br>
          <span class="sub">${p.count} ders · ${p.days} gün · ${p.serviceIds?.length
            ? p.serviceIds.map(i=>esc(svc(i)?.name)).join(', ') : 'tüm dersler'}</span></span>
          <span class="rt" style="font-weight:600">${money(p.price)}</span></button>`).join('')}</div>

      ${pkg ? `
      <div class="field"><label for="st">3 · Başlangıç tarihi</label>
        <input id="st" type="date" value="${F.start}">
        <p class="lbl" style="margin:5px 0 0">Bitiş: ${fmtDate(new Date(exp))} (${pkg.days} gün)</p></div>

      <div class="sumbox">
        <div class="row sp"><span>Liste fiyatı</span><b class="num">${money(list)}</b></div>
        <div class="row sp" style="margin-top:8px"><span>4 · İndirim</span>
          <input id="disc" type="number" min="0" max="${list}" step="50" value="${F.discount}"
            class="tin num" style="width:110px;text-align:right"></div>
        <div class="row sp sumnet"><span><b>Net satış</b></span><b class="num">${money(net)}</b></div>
      </div>

      <div class="field" style="margin-top:14px"><label for="col">5 · Tahsil edilen</label>
        <input id="col" type="number" min="0" max="${net}" step="50" value="${F.collected}" class="num"></div>

      <div class="sumbox ${due>0?'warnbox':'okbox'}">
        <div class="row sp"><span>Kalan borç</span><b class="num">${money(due)}</b></div>
      </div>

      <div class="field" style="margin-top:14px"><label>6 · Ödeme yöntemi</label>
        <div class="chiprow">${PAY_METHODS.map(([k,l])=>
          `<button type="button" class="chip ${F.method===k?'on':''}" data-pm="${k}">${l}</button>`).join('')}</div></div>

      ${due>0 ? `<div class="field"><label for="dd">7 · Son ödeme tarihi</label>
        <input id="dd" type="date" value="${F.dueDate||iso(addDays(new Date(),14))}"></div>`:''}

      <div class="summary">
        <div style="font-weight:600;margin-bottom:7px">Satış özeti</div>
        <div class="row sp"><span>${esc(m.name)}</span><span>${esc(pkg.name)}</span></div>
        <div class="row sp"><span class="lbl">Net tutar</span><span class="num">${money(net)}</span></div>
        <div class="row sp"><span class="lbl">Tahsil edilen</span>
          <span class="num">${money(F.collected)} · ${payLabel(F.method)}</span></div>
        <div class="row sp"><span class="lbl">Kalan</span><span class="num">${money(due)}</span></div>
        <div class="row sp"><span class="lbl">Geçerlilik</span>
          <span class="num">${fmtDate(new Date(F.start))} – ${fmtDate(new Date(exp))}</span></div>
      </div>

      <button class="btn go" id="ok" style="width:100%;margin-top:14px">Satışı onayla</button>
      ` : '<p class="lbl" style="margin:4px 0 0">Devam etmek için bir paket seç.</p>'}
    </div>`;

    $('#modal').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeAll);
    $('#who').onclick = () => pickMember('Üye seç', (id)=>{ F.memberId = id;
      openModal('<div class="mbody"></div>'); render(); });
    $('#modal').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
      F.pkgId = b.dataset.p;
      const pk = DB.packages.find(x=>x.id===F.pkgId);
      F.collected = pk.price; F.discount = 0; render(); });
    $('#modal').querySelectorAll('[data-pm]').forEach(b=>b.onclick=()=>{ F.method=b.dataset.pm; render(); });
    const st = $('#st');   if (st) st.onchange = e => { F.start = e.target.value; render(); };
    const dd = $('#dd');   if (dd) dd.onchange = e => { F.dueDate = e.target.value; };
    const di = $('#disc'); if (di) di.onchange = e => {
      F.discount = Math.min(Math.max(+e.target.value||0,0), list);
      F.collected = Math.min(F.collected, Math.max(list-F.discount,0)); render(); };
    const co = $('#col');  if (co) co.onchange = e => {
      F.collected = Math.min(Math.max(+e.target.value||0,0), net); render(); };

    bindLock('#ok', ()=>commit(net, due, exp, pkg));
  };

  const commit = (net, due, exp, pkg) => {
    const old = anyPlan(F.memberId);
    if (old) old.status = 'completed';

    const plan = { id:uid(), memberId:F.memberId, name:pkg.name, total:pkg.count, used:0,
      serviceIds: pkg.serviceIds || [], listPrice: pkg.price, discount: F.discount,
      price: net, paid: F.collected, dueDate: due>0 ? (F.dueDate || iso(addDays(new Date(),14))) : null,
      start:F.start, expires:exp, status:'active' };
    DB.plans.push(plan);
    DB.ledger.push({ id:uid(), planId:plan.id, delta:pkg.count,
                     reason:'Paket satışı — '+pkg.name, date:iso(new Date()) });
    if (F.collected > 0)
      DB.payments.push({ id:uid(), memberId:F.memberId, planId:plan.id,
                         amount:F.collected, method:F.method, date:iso(new Date()) });
    logAct('paket_satisi', `${mem(F.memberId).name} · ${pkg.name} · ${money(net)}`,
           { kind:'plan_sale', planId:plan.id, prevPlanId: old?.id || null });
    // Sabit programı olan üyede yeni paket rezervasyonları ileriye uzatır
    const st = standingOf(F.memberId);
    const ext = st ? applyStanding(st).created : 0;
    save(); closeAll(); route();
    if (ext) toast(`Sabit programdan ${ext} rezervasyon oluşturuldu`);

    if (onDone) onDone(F.memberId);
    toastUndo(`${firstN(mem(F.memberId).name)} · ${pkg.name} satıldı`, ()=>{
      DB.plans    = DB.plans.filter(x=>x.id!==plan.id);
      DB.ledger   = DB.ledger.filter(x=>x.planId!==plan.id);
      DB.payments = DB.payments.filter(x=>x.planId!==plan.id);
      if (old) old.status = 'active';
      logAct('paket_satisi_geri_alindi', `${mem(F.memberId).name} · ${pkg.name}`);
      save(); route(); toast('Satış geri alındı');
    });
  };

  openModal('<div class="mbody"></div>');
  render();
}

function payModal(planId){
  const p = DB.plans.find(x=>x.id===planId);
  const due = p.price - p.paid;
  openModal(`<div class="mhead"><div class="row sp">
      <div><div style="font-weight:600;font-size:16px">Ödeme al</div>
      <div class="lbl">${esc(mem(p.memberId)?.name)} · ${esc(p.name)}</div></div>
      <button class="btn sm" data-close>Kapat</button></div></div>
    <div class="mbody">
      <ul class="ledger" style="margin-bottom:12px">
        <li><span>Paket tutarı</span><span>${money(p.price)}</span></li>
        <li><span>Tahsil edilen</span><span>${money(p.paid)}</span></li>
        <li><span><b>Kalan</b></span><span><b>${money(due)}</b></span></li></ul>
      <div class="field"><label for="am">Alınan tutar</label>
        <input id="am" type="number" inputmode="numeric" min="1" max="${due}" value="${due}"></div>
      <div class="field"><label>Ödeme yöntemi</label>
        <div class="chiprow" id="pm">${PAY_METHODS.map(([k,l],i)=>
          `<button type="button" class="chip ${i===0?'on':''}" data-pm="${k}">${l}</button>`).join('')}</div></div>
      <button class="btn go" id="ok" style="width:100%">Kaydet</button></div>`);
  $('#am').focus(); $('#am').select();
  let method = 'cash';
  $('#modal').querySelectorAll('[data-pm]').forEach(b=>b.onclick=()=>{
    method = b.dataset.pm;
    $('#modal').querySelectorAll('[data-pm]').forEach(x=>x.classList.toggle('on', x===b)); });
  bindLock('#ok', () => {
    const a = Math.min(Math.max(+$('#am').value||0, 0), due);
    if (!a) return toast('Tutar gir', true);
    p.paid += a;
    DB.payments.push({ id:uid(), memberId:p.memberId, planId:p.id, amount:a,
                       method, date:iso(new Date()) });
    const payId = DB.payments[DB.payments.length-1].id;
    logAct('tahsilat', `${mem(p.memberId)?.name} · ${money(a)} · ${payLabel(method)}`,
           { kind:'payment', paymentId:payId });
    save(); closeAll(); route();
    toast(p.paid>=p.price ? 'Borç kapandı' : `${money(a)} alındı, ${money(p.price-p.paid)} kaldı`);
  });
}

function openMember(mid){

  const led = DB.ledger.filter(l=>ids.includes(l.planId)).slice().reverse().slice(0,14);
  const hist = DB.bookings.filter(b=>b.memberId===mid).slice().reverse().slice(0,10);

    <div class="dhead"><div class="row sp">
      <div><h2 style="font-size:20px">${esc(m.name)}</h2>
        <div class="lbl num">${esc(showPhone(m.phone)||'telefon yok')}</div></div>

             :'<span class="tag stop">Paket yok</span>'}
        ${act && act.price>act.paid?`<span class="tag warn">${money(act.price-act.paid)} borç</span>`:''}
      </div></div>
    <div class="dbody">
      ${m.note?`<div class="sect"><h3>Not</h3><div class="card pad" style="background:var(--c-surface-mute);font-size:13.5px">${esc(m.note)}</div></div>`:''}
      <div class="sect"><h3>Paketler</h3><ul class="ledger">
        ${plans.map(p=>`<li><span>${esc(p.name)}<div class="d">${fmtDate(new Date(p.start))} – ${fmtDate(new Date(p.expires))}</div></span>
          <span>${p.status==='active'?`<span class="tag go">${left(p)} ders</span>`:'<span class="tag mute">bitti</span>'}</span></li>`).join('')
          ||'<li class="lbl">Paket yok</li>'}</ul></div>
      <div class="sect"><h3>Hak hareketleri</h3><ul class="ledger">
        ${led.map(l=>`<li><span>${esc(l.reason)}<div class="d">${fmtDate(new Date(l.date))}</div></span>
          <span class="amt ${l.delta<0?'minus':'plus'} num">${l.delta>0?'+':''}${l.delta}</span></li>`).join('')
          ||'<li class="lbl">Hareket yok</li>'}</ul></div>
      <div class="sect"><h3>Son dersler</h3><ul class="ledger">
        ${hist.map(b=>{ const [sid,d]=b.key.split('|');
          /* ders tek seferlik de olabilir — yalnızca haftalık seriye bakmak yetmez */
          const ser = DB.series.find(x=>x.id===sid) || (DB.extra||[]).find(x=>x.id===sid);
          const s = svc(ser?.serviceId);
          return `<li><span>${esc(s?.name||'—')}<div class="d">${fmtDate(new Date(d))}</div></span>
          <span>${({booked:'<span class="tag plum">Rezerve</span>',attended:'<span class="tag go">Geldi</span>',
            no_show:'<span class="tag stop">Gelmedi</span>',cancelled:'<span class="tag mute">İptal</span>',
            late_cancel:'<span class="tag stop">Geç iptal</span>',
            waitlist:'<span class="tag mute">Beklemede</span>'})[b.status]
            || '<span class="tag mute">—</span>'}</span></li>`;
          }).join('')||'<li class="lbl">Ders yok</li>'}</ul></div>
      ${pays.length?`<div class="sect"><h3>Ödemeler</h3><ul class="ledger">
        ${pays.map(x=>`<li><span>${DB.plans.find(p=>p.id===x.planId)?.name||'Ödeme'}
          <div class="d">${fmtDate(new Date(x.date))}</div></span>
          <span class="amt plus">${money(x.amount)}</span></li>`).join('')}</ul></div>`:''}
      <div class="sect"><h3>Sabit program</h3>
        ${(()=>{ const st = standingOf(mid); return st
          ? `<div class="card pad" style="box-shadow:none;background:var(--plum-bg);
               border-color:var(--plum);font-size:13.5px">
               <b>${esc(standingLabel(st))}</b>
               <div class="lbl" style="margin-top:3px">Haftada ${st.slots.length} ders${
                 st.until?` · ${fmtDate(new Date(st.until))} tarihine kadar`:' · hak bitene kadar'}</div>
             </div>`
          : '<p class="lbl" style="margin:0 0 8px">Tanımlı değil — üye her hafta aynı saatlere geliyorsa tanımla.</p>';
        })()}
        <button class="btn" style="width:100%;margin-top:8px" id="dst">
          ${standingOf(mid)?'Sabit programı düzenle':'Sabit program tanımla'}</button></div>

      ${act && act.price>act.paid

  $('#drawer').classList.add('on'); $('#scrim').classList.add('on');
  $('#dc').onclick = closeAll;
  $('#ds').onclick = () => { closeAll(); sellModal(mid); };
  const dp = $('#dp'); if (dp) dp.onclick = () => payModal(act.id);
  $('#dst').onclick = () => { closeAll(); standingModal(mid); };
}


/* =====================================================================
   PROGRAM KURULUM ARAÇLARI
   Tek tek tıklamak yerine: gün × saat kesişimini toplu aç,
   bir günü başka güne kopyala, saati silmeden kapat/aç.
   ===================================================================== */

/* Çalışma saatleri içindeki tüm yarım saatler */
function hourChoices(){
  const out = [];
  const a = minutes(DB.studio.open||'07:00'), b = minutes(DB.studio.close||'22:00');
  for (let t=a; t<b; t+=30)
    out.push(`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`);
  return out;
}

/* Bir ders saati eklenebilir mi — salon ve eğitmen çakışması */
function slotClash(weekday, time, serviceId, trainerId){
  const sv = svc(serviceId);
  const here = DB.series.filter(x=>x.weekday===weekday && x.time===time && !x.off);
  if (here.some(x=>x.trainerId===trainerId)) return 'egitmen';
  if (here.some(x=>svc(x.serviceId)?.roomId === sv?.roomId)) return 'salon';
  return null;
}

/* Belirli bir tarihte, haftalık programı bozmadan tek seferlik ders.
   Deneme dersi, telafi dersi ve özel ders için. DB.extra'ya yazılır;
   classesOn() bunları zaten okuyor ve "tek seferlik" diye işaretliyor. */
function onceClash(dISO, time, serviceId, trainerId){
  const sv = svc(serviceId);
  const here = classesOn(dISO).filter(k=>!k.cancelled && k.time===time);
  if (here.some(k=>k.trainerId===trainerId)) return 'egitmen';
  if (here.some(k=>svc(k.serviceId)?.roomId === sv?.roomId)) return 'salon';
  return null;
}

            data-s="${x.id}" aria-pressed="${sid===x.id}">${esc(x.name)}</button>`).join('')}</div>
        <p class="lbl" style="margin:6px 0 0">${sv

        <div class="chiprow">${DB.trainers.map(x=>
          `<button type="button" class="chip ${tid===x.id?'on':''}"

          : `<b>${esc(room(sv?.roomId)?.name||'')}</b> ${T('o saatte dolu.','is full at that time.')}`

/* TOPLU KURULUM — gün ve saat seç, kesişimi bir seferde aç */
function bulkProgramModal(){
  if (!DB.services.length || !DB.trainers.length)
    return toast('Önce ders tipi ve eğitmen tanımla', true);

  const order = [1,2,3,4,5,6,0];
  let days = [1,3,5];
  let hours = [];
  let sid = brush.serviceId || DB.services[0].id;
  let tid = brush.trainerId || DB.trainers[0].id;

  const render = () => {
    const choices = hourChoices();
    const total = days.length * hours.length;
    let clash = 0;
    days.forEach(w=>hours.forEach(h=>{ if (slotClash(w,h,sid,tid)) clash++; }));

    $('#modal').innerHTML = `
    <div class="mhead"><div class="row sp">
      <div><div style="font-weight:600;font-size:16px">Toplu ders saati aç</div>
      <div class="lbl">Gün ve saatleri seç, kesişimi tek seferde açılsın</div></div>
      <button class="btn sm" data-close aria-label="Kapat">✕</button></div></div>
    <div class="mbody">

      <div class="field"><label>1 · Günler</label>
        <div class="chiprow">
          ${order.map(w=>`<button type="button" class="chip ${days.includes(w)?'on':''}"
            data-d="${w}" aria-pressed="${days.includes(w)}">${TR_DAY[w]}</button>`).join('')}</div>
        <div class="row" style="gap:6px;margin-top:7px">
          <button type="button" class="btn sm" data-dp="hafta">Hafta içi</button>
          <button type="button" class="btn sm" data-dp="tum">Tüm hafta</button>
          <button type="button" class="btn sm" data-dp="yok">Temizle</button></div></div>

      <div class="field"><label>2 · Saatler</label>
        <div class="chiprow hourwrap">
          ${choices.map(h=>`<button type="button" class="chip hourchip ${hours.includes(h)?'on':''}"
            data-h="${h}" aria-pressed="${hours.includes(h)}">${h}</button>`).join('')}</div>
        <p class="lbl" style="margin:6px 0 0">Çalışma saatlerin ${DB.studio.open||'07:00'}–${
          DB.studio.close||'22:00'}. Ayarlar'dan değiştirebilirsin.</p></div>

      <div class="field"><label>3 · Ders</label>
        <div class="chiprow">${DB.services.map(x=>
          `<button type="button" class="chip ${sid===x.id?'on':''}" data-s="${x.id}" aria-pressed="${sid===x.id}">${esc(x.name)}</button>`).join('')}
          <button type="button" class="chip addchip" id="newsvc">+ Yeni ders tipi</button></div>
        <p class="lbl" style="margin:6px 0 0">${(()=>{ const sv=svc(sid);
          return sv ? `${esc(room(sv.roomId)?.name||'')} · ${capOf(sv)} kişi · ${sv.dur} dk` : ''; })()}</p></div>

      ${DB.trainers.length>1?`<div class="field"><label>4 · Eğitmen</label>
        <div class="chiprow">${DB.trainers.map(x=>
          `<button type="button" class="chip ${tid===x.id?'on':''}" data-t="${x.id}">${esc(x.name)}</button>`).join('')}</div></div>`:''}

      <div class="stsum">
        <div class="row sp"><span>Açılacak ders saati</span><b>${total - clash}</b></div>
        ${clash?`<div class="row sp"><span>Çakışma (atlanacak)</span>
          <b style="color:var(--warn)">${clash}</b></div>`:''}
        ${total?`<div class="row sp"><span>Haftalık</span>
          <b>${days.map(w=>TR_DAY[w]).join(', ')} · ${hours.join(', ')}</b></div>`:''}
      </div>

      <button class="btn go" id="ok" style="width:100%;margin-top:14px"
        ${total-clash>0?'':'disabled'}>${total-clash>0?`${total-clash} ders saati aç`:'Gün ve saat seç'}</button>
    </div>`;

    $('#modal').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeAll);
    $('#modal').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
      const w=+b.dataset.d, i=days.indexOf(w); i<0?days.push(w):days.splice(i,1); render(); });
    $('#modal').querySelectorAll('[data-dp]').forEach(b=>b.onclick=()=>{
      days = b.dataset.dp==='hafta' ? [1,2,3,4,5] : b.dataset.dp==='tum' ? [1,2,3,4,5,6,0] : [];
      render(); });
    $('#modal').querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{
      const h=b.dataset.h, i=hours.indexOf(h); i<0?hours.push(h):hours.splice(i,1);
      hours.sort(); render(); });
    $('#modal').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ sid=b.dataset.s; render(); });
    $('#newsvc').onclick = () => editService(null, (yeniId)=>{ sid = yeniId;
      openModal('<div class="mbody"></div>'); render(); });
    $('#modal').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ tid=b.dataset.t; render(); });

    bindLock('#ok', ()=>{
      let n=0, sk=0; const eklenen=[];
      days.forEach(w=>hours.forEach(h=>{
        if (slotClash(w,h,sid,tid)){ sk++; return; }
        const yid = uid(); eklenen.push(yid);
        DB.series.push({ id:yid, weekday:w, time:h, serviceId:sid, trainerId:tid, off:false });
        n++;
      }));
      brush.serviceId = sid; brush.trainerId = tid;
      logAct('toplu_program', `${n} ders saati · ${days.map(w=>TR_DAY[w]).join(',')} ${hours.join(',')}`,
             { kind:'series_add', ids:eklenen });
      save(); closeAll(); route();
      toast(sk ? `${n} ders saati açıldı, ${sk} çakışma atlandı` : `${n} ders saati açıldı`);
    });
  };
  openModal('<div class="mbody"></div>');
  render();
}

/* GÜN KOPYALAMA — bir günün tüm saatlerini başka günlere taşı */
function copyDayModal(srcW){
  const src = DB.series.filter(x=>x.weekday===srcW);
  if (!src.length) return toast('Bu günde ders saati yok', true);
  const order = [1,2,3,4,5,6,0].filter(w=>w!==srcW);
  let targets = [];

  const render = () => {
    $('#modal').innerHTML = `
    <div class="mhead"><div class="row sp">
      <div><div style="font-weight:600;font-size:16px">${TR_FULL[srcW]} gününü kopyala</div>
      <div class="lbl">${src.length} ders saati</div></div>
      <button class="btn sm" data-close aria-label="Kapat">✕</button></div></div>
    <div class="mbody">
      <div class="field"><label>Hangi günlere kopyalansın</label>
        <div class="chiprow">${order.map(w=>`<button type="button"
          class="chip ${targets.includes(w)?'on':''}" data-d="${w}" aria-pressed="${targets.includes(w)}">${TR_FULL[w]}</button>`).join('')}</div></div>
      <div class="stsum">
        <div class="row sp"><span>Kopyalanacak</span><b>${src.length} × ${targets.length} = ${
          src.length*targets.length}</b></div>
        <div class="row sp"><span>Saatler</span>
          <b>${src.map(x=>x.time).sort().join(', ')}</b></div></div>
      <button class="btn go" id="ok" style="width:100%;margin-top:14px"
        ${targets.length?'':'disabled'}>Kopyala</button></div>`;
    $('#modal').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeAll);
    $('#modal').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
      const w=+b.dataset.d, i=targets.indexOf(w); i<0?targets.push(w):targets.splice(i,1); render(); });
    bindLock('#ok', ()=>{
      let n=0, sk=0; const eklenen2=[];
      targets.forEach(w=>src.forEach(x=>{
        if (slotClash(w, x.time, x.serviceId, x.trainerId)){ sk++; return; }
        const yid = uid(); eklenen2.push(yid);
        DB.series.push({ id:yid, weekday:w, time:x.time, serviceId:x.serviceId,
                         trainerId:x.trainerId, off:false });
        n++;
      }));
      logAct('gun_kopyalandi', `${TR_FULL[srcW]} → ${targets.map(w=>TR_DAY[w]).join(',')} · ${n} saat`,
             { kind:'series_add', ids:eklenen2 });
      save(); closeAll(); route();
      toast(sk ? `${n} saat kopyalandı, ${sk} çakışma atlandı` : `${n} ders saati kopyalandı`);
    });
  };
  openModal('<div class="mbody"></div>');
  render();
}

/* Bir günün tüm saatlerini kapat / aç */
function toggleDay(w, off){
  const list = DB.series.filter(x=>x.weekday===w);
  list.forEach(x=>{ x.off = off; });
  logAct(off?'gun_saatleri_kapatildi':'gun_saatleri_acildi',
         `${TR_FULL[w]} · ${list.length} saat`);
  save(); route();
  toast(off ? `${TR_FULL[w]} saatleri kapatıldı` : `${TR_FULL[w]} saatleri açıldı`);
}

/* =====================================================================
   DERS PROGRAMI — tıklayarak kur
   Üstten ders + eğitmen seç, ızgarada boş kutulara tıkla.
   ===================================================================== */
let brush = { serviceId:null, trainerId:null };

function gridTimes(){
  const out = [];
  const a = minutes(DB.studio.open || '07:00'), b = minutes(DB.studio.close || '22:00');
  for (let t = a; t < b; t += 30)
    out.push(`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`);
  return out;
}

let progMode = 'edit';        // 'edit' = ekle/düzenle | 'toggle' = aç-kapa
function viewProgram(){
  // Silinmiş/geçersiz seçim sessizce ilk kayda düşmesin — her render'da doğrula
  if (!DB.services.some(x=>x.id===brush.serviceId)) brush.serviceId = DB.services[0]?.id || null;
  if (!DB.trainers.some(x=>x.id===brush.trainerId)) brush.trainerId = DB.trainers[0]?.id || null;
  const times = gridTimes();
  const order = [1,2,3,4,5,6,0];

  const head = `<div></div>` + order.map(w=>{
    const n = DB.series.filter(x=>x.weekday===w).length;
    const acikN = DB.series.filter(x=>x.weekday===w && !x.off).length;
    return `<button class="hd dayhd ${n?'':'dim'}" data-day="${w}" title="${TR_FULL[w]}">
      ${TR_DAY[w]}<small>${n?(acikN===n?`${n}`:`${acikN}/${n}`):'—'}</small></button>`;
  }).join('');
  const rows = times.map(t => `<div class="tm num">${t}</div>` + order.map(w => {
    const here = DB.series.filter(x=>x.weekday===w && x.time===t);
    const chips = here.map(s=>{
      const sv = svc(s.serviceId), tr = trn(s.trainerId);
      return `<button class="gchip ${s.off?'goff':''}"
        data-${progMode==='toggle'?'tg':'edit'}="${s.id}"
        title="${esc(sv?.name)} · ${esc(tr?.name||'')}${s.off?' · KAPALI':''}"
        style="--c:${colorOf(s.serviceId)}">
        <b>${esc(shortSvc(sv?.name))}</b><span>${s.off?'kapalı':esc(firstN(tr?.name||''))}</span></button>`;
    }).join('');
    return `<div class="gstack">${chips}
      <button class="gcell" data-add="${w}|${t}" title="${TR_FULL[w]} ${t} — ders ekle">
        ${here.length?'+':''}</button></div>`;
  }).join('')).join('');

  const acik = DB.series.filter(x=>!x.off).length;
  host().innerHTML = `<div class="head">
    <div><h1>Ders programı</h1>
      <p>${acik} açık${DB.series.length-acik?` · ${DB.series.length-acik} kapalı`:''}</p></div></div>

    <div class="row" style="gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <button class="btn pri" id="bulk" style="flex:1;min-width:150px">Toplu saat aç</button>
      <button class="btn" id="copy" style="flex:1;min-width:150px">Günü kopyala</button></div>

    <div class="seg small" style="margin-bottom:12px">
      <button class="${progMode==='edit'?'on':''}" data-pmode="edit">Ekle / düzenle</button>
      <button class="${progMode==='toggle'?'on':''}" data-pmode="toggle">Aç / kapa</button></div>

    ${progMode==='toggle'?`<div class="hint">Bir saate dokun, <b>silmeden</b> kapat veya aç.
      Kapalı saatler takvimde açılmaz, üyeler görmez — program tanımın korunur.</div>`:''}

    ${!DB.series.length?`<div class="hint"><b>Program boş.</b>
      "Toplu saat aç" ile günleri ve saatleri seç — Pzt/Çar/Cum 09:00 gibi bir program
      tek seferde kurulur.</div>`:''}

    <div class="card pad" style="margin-bottom:12px${progMode==='toggle'?';display:none':''}">
      <div class="lbl" style="margin-bottom:7px">Eklenecek ders
        <b style="color:var(--ink)">— ${esc(svc(brush.serviceId)?.name || 'seçilmedi')}${
          DB.trainers.length>1 ? ' / '+esc(trn(brush.trainerId)?.name || '') : ''}</b></div>
      <div class="chiprow">${DB.services.map(s=>
        `<button class="chip ${brush.serviceId===s.id?'on':''}" data-bs="${s.id}" aria-pressed="${brush.serviceId===s.id}">${esc(s.name)}</button>`).join('')}</div>
      ${DB.trainers.length>1 ? `<div class="lbl" style="margin:10px 0 7px">Eğitmen</div>
      <div class="chiprow">${DB.trainers.map(t=>
        `<button class="chip ${brush.trainerId===t.id?'on':''}" data-bt="${t.id}" aria-pressed="${brush.trainerId===t.id}">${esc(t.name)}</button>`).join('')}</div>`:''}
      <p class="lbl" style="margin:10px 0 0">Yukarıdan seç, aşağıda boş kutulara tıkla.
        Dolu bir kutuya tıklarsan değiştirir veya kaldırırsın.</p>
    </div>

    ${!DB.series.length?`<div class="hint"><b>Program boş.</b>
      "Toplu saat aç" ile günleri ve saatleri seç — Pzt/Çar/Cum 09:00 gibi bir program
      tek seferde kurulur.</div>`:''}
    <div class="card pad" style="overflow-x:auto">
      <div class="grid" style="grid-template-columns:54px repeat(7,minmax(58px,1fr))">
        ${head}${rows}</div>
    </div>

    <div class="card pad" style="margin-top:12px">
      <div class="row sp"><span class="lbl">Çalışma saatleri</span>
        <span class="row" style="gap:6px">
          <input id="op" type="time" value="${DB.studio.open||'07:00'}" class="tin">
          <span class="lbl">–</span>
          <input id="cl" type="time" value="${DB.studio.close||'22:00'}" class="tin">
          <button class="btn sm" id="sh">Uygula</button></span></div></div>`;

  document.querySelectorAll('[data-bs]').forEach(b=>b.onclick=()=>{ brush.serviceId=b.dataset.bs; route(); });
  document.querySelectorAll('[data-bt]').forEach(b=>b.onclick=()=>{ brush.trainerId=b.dataset.bt; route(); });
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
    const [w,t] = b.dataset.add.split('|');
    const sv = svc(brush.serviceId);
    if (!sv) return toast('Önce yukarıdan bir ders tipi seç', true);
    if (!trn(brush.trainerId)) return toast('Önce bir eğitmen seç', true);
    const clash = DB.series.filter(x=>x.weekday===+w && x.time===t);
    if (clash.some(x=>x.trainerId===brush.trainerId))
      return toast(`${firstN(trn(brush.trainerId)?.name)} o saatte başka ders veriyor`, true);
    if (clash.some(x=>svc(x.serviceId)?.roomId === sv?.roomId))
      return toast(`${room(sv?.roomId)?.name} o saatte dolu`, true);
    DB.series.push({ id:uid(), weekday:+w, time:t, serviceId:brush.serviceId, trainerId:brush.trainerId });
    save(); route();
  });
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>slotEdit(b.dataset.edit));
  document.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{
    const x = DB.series.find(y=>y.id===b.dataset.tg);
    x.off = !x.off; save(); route();
    toast(x.off ? `${TR_DAY[x.weekday]} ${x.time} kapatıldı` : `${TR_DAY[x.weekday]} ${x.time} açıldı`); });
  document.querySelectorAll('[data-pmode]').forEach(b=>b.onclick=()=>{
    progMode = b.dataset.pmode; route(); });
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>dayHeadMenu(+b.dataset.day));
  $('#bulk').onclick = () => bulkProgramModal();
  $('#copy').onclick = () => pickerModal({ title:'Hangi günü kopyalayacaksın?',
    items:[1,2,3,4,5,6,0].map(w=>({ id:String(w), search:TR_FULL[w], label:TR_FULL[w],
      sub:`${DB.series.filter(x=>x.weekday===w).length} ders saati` })),
    onPick:(w)=>copyDayModal(+w) });
  $('#sh').onclick = () => {
    const o = $('#op').value, c = $('#cl').value;
    if (minutes(c) <= minutes(o)) return toast('Kapanış, açılıştan sonra olmalı', true);
    DB.studio.open = o; DB.studio.close = c; save(); route();
  };
}

function dayHeadMenu(w){
  const list = DB.series.filter(x=>x.weekday===w);
  const acik = list.filter(x=>!x.off).length;
  openModal(`<div class="mhead"><div class="row sp">
      <div><div style="font-weight:600;font-size:16px">${TR_FULL[w]}</div>
      <div class="lbl">${list.length} ders saati${list.length-acik?` · ${list.length-acik} kapalı`:''}</div></div>
      <button class="btn sm" data-close aria-label="Kapat">✕</button></div></div>
    <div class="mbody">
      <button class="btn" id="add" style="width:100%;margin-bottom:8px">Bu güne toplu saat ekle</button>
      ${list.length?`
      <button class="btn" id="cp" style="width:100%;margin-bottom:8px">Bu günü başka güne kopyala</button>
      ${acik?`<button class="btn stop" id="off" style="width:100%;margin-bottom:8px">
        Tüm saatleri kapat (${acik})</button>`:''}
      ${list.length-acik?`<button class="btn go" id="on" style="width:100%;margin-bottom:8px">
        Kapalı saatleri aç (${list.length-acik})</button>`:''}
      <button class="btn stop" id="del" style="width:100%">Bu günün saatlerini sil</button>`:''}
    </div>`);
  $('#add').onclick = () => { closeAll(); bulkProgramModal(); };
  const cp=$('#cp'); if (cp) cp.onclick = () => { closeAll(); copyDayModal(w); };
  const of=$('#off'); if (of) of.onclick = () => { closeAll(); toggleDay(w, true); };
  const on=$('#on'); if (on) on.onclick = () => { closeAll(); toggleDay(w, false); };
  const dl=$('#del'); if (dl) dl.onclick = () => {
    const booked = DB.bookings.filter(b=>list.some(x=>b.key.startsWith(x.id+'|'))
      && ['booked','waitlist'].includes(b.status)).length;
    askConfirm({ title:`${TR_FULL[w]} saatlerini sil`,
      body:`${list.length} ders saati kalkacak.${booked?` Bu saatlerde <b>${booked} rezervasyon</b> var.`:''}
        Silmek yerine <b>kapatmayı</b> düşün — program tanımın korunur.`,
      danger:'Sil',
      onOk:()=>{ const kopya = JSON.parse(JSON.stringify(list));
        DB.series = DB.series.filter(x=>x.weekday!==w);
        logAct('gun_saatleri_silindi', `${TR_FULL[w]} · ${list.length}`,
               { kind:'series_remove', items:kopya });
        save(); route(); toast('Silindi'); }});
  };
}
