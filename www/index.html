/* =====================================================================
   ÜYE GÖRÜNÜMÜ
   Üye yalnızca uygun saatlerden randevu seçer ve iptal eder.
   Kayıt, paket satışı ve ücret bilgisi üye tarafında YOKTUR —
   bunları yalnızca eğitmen yapar.
   ===================================================================== */
let stuId = null, stuDay = 0;

function viewMember(){
  if (!DB.members.length){
    $('#view').innerHTML = `<div class="head"><div><h1>Üye görünümü</h1>
      <p>Üyenin telefonunda göreceği ekran</p></div></div>
      <div class="card empty-note">Önce Üyeler bölümünden üye ekle.<br>
        <span class="lbl">Üye kaydını her zaman eğitmen açar.</span></div>`;
    return;
  }
  if (!DB.series.length && !(DB.extra||[]).length){
    $('#view').innerHTML = `<div class="head"><div><h1>Üye görünümü</h1>
      <p>Üyenin telefonunda göreceği ekran</p></div></div>
      <div class="card empty-note">Önce ders programını kur.</div>`;
    return;
  }
  if (!stuId || !mem(stuId)) stuId = DB.members[0].id;

  const m = mem(stuId);
  const days = Array.from({length:14},(_,i)=>addDays(new Date(), i));
  if (stuDay >= days.length) stuDay = 0;
  const d = days[stuDay], dISO = iso(d);
  const ks = classesOn(dISO).filter(k=>!k.cancelled);

  // Üyenin kullanabileceği paketler — ücret gösterilmez, yalnızca kalan hak
  const usable = DB.plans.filter(p=>p.memberId===stuId && planValid(p, dISO));
  const totalLeft = usable.reduce((a,p)=>a+left(p), 0);

  /* Saatleri saat başına grupla (MHRS düzeni) */
  const byHour = {};
  ks.forEach(k=>{ const h = k.time.slice(0,2)+':00'; (byHour[h]=byHour[h]||[]).push(k); });
  const hours = Object.keys(byHour).sort();

  const grid = hours.map(h=>`
    <div class="hr num">${h}</div>
    <div class="hslots">${byHour[h].map(k=>{
      const s = svc(k.serviceId), cp = capOf(s);
      const bk = bookingsOf(k.key);
      const mine = bk.find(b=>b.memberId===stuId);
      const free = cp - bk.filter(b=>b.status!=='waitlist').length;
      const blocks = mine ? [] : bookingBlocks(stuId, k.key, k.serviceId, dISO, k.time);
      const past = new Date(dISO+'T'+k.time) < new Date();
      const cls = mine ? (mine.status==='waitlist'?'wait':'mine')
                : past ? 'past' : free<=0 ? 'full' : blocks.length ? 'blocked' : 'free';
      return `<button class="tslot ${cls}" ${past?'disabled':''}
        ${mine?`data-sc="${mine.id}"`:`data-sb="${k.key}"`}
        aria-label="${esc(s?.name)} ${k.time} ${free>0?free+' yer':'dolu'}"
        title="${esc(s?.name)} · ${esc(trn(k.trainerId)?.name||'')}">
        <b class="num">${k.time}</b>
        <span>${esc(shortSvc(s?.name))} · ${esc(firstN(trn(k.trainerId)?.name))}</span>
        <small>${cls==='mine'?'Kayıtlısın':cls==='wait'?'Sıradasın':cls==='past'?'Geçti'
          :cls==='full'?'Dolu · sıraya gir':cls==='blocked'?'Uygun değil'
          :free<=2?`${free} yer kaldı`:`${free} yer var`}</small></button>`;
    }).join('')}</div>`).join('');

  /* Yaklaşan randevular */
  const mineAll = DB.bookings
    .filter(b=>b.memberId===stuId && ['booked','waitlist'].includes(b.status))
    .map(b=>({ b, dISO:b.key.split('|')[1],
               k: classesOn(b.key.split('|')[1]).find(x=>x.key===b.key) }))
    .filter(x=>x.k && !x.k.cancelled && new Date(x.dISO+'T'+x.k.time) > new Date())
    .sort((a,b)=>(a.dISO+a.k.time).localeCompare(b.dISO+b.k.time));

  $('#view').innerHTML = `<div class="head">
    <div><h1>Üye görünümü</h1><p>Üye yalnızca uygun saatlerden randevu seçer</p></div>
    <label class="row" style="gap:7px">
      <span class="lbl">Önizlenen üye</span>
      <select id="who" class="tin" style="min-width:170px"
        aria-label="Önizlenecek üye">${DB.members.map(x=>
        `<option value="${x.id}" ${x.id===stuId?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
    </label></div>

  <div class="hint">Üye tarafında kayıt olma, paket alma ve ücret bilgisi <b>yoktur</b>.
    Üyeyi sisteme eğitmen ekler, paketi eğitmen tanımlar.</div>

  <div class="phone">
    <div class="pbar"><b>${esc(DB.studio.name)}</b>
      <span>${esc(firstN(m.name))} · ${totalLeft>0
        ? `${totalLeft} ders hakkın var` : 'ders hakkın kalmadı'}</span></div>

    <div class="ptabs">${days.slice(0,10).map((x,i)=>{
      const has = classesOn(iso(x)).some(k=>!k.cancelled);
      return `<button class="ptab ${i===stuDay?'on':''} ${has?'':'nod'}" data-day="${i}">
        ${i===0?'Bugün':i===1?'Yarın':TR_DAY[x.getDay()]}
        <small>${x.getDate()}.${String(x.getMonth()+1).padStart(2,'0')}</small></button>`;
    }).join('')}</div>

    <div class="pbody">
      ${totalLeft<=0 ? `<div class="hint" style="margin:0 0 12px">
        Ders hakkın kalmadı. Yeni paket için stüdyoyla görüş.</div>`:''}
      ${hours.length ? `<div class="mh">${grid}</div>`
        : '<div class="empty-note">Bu gün ders yok.</div>'}

      <div class="legend">
        <span><i class="sw free"></i>Müsait</span>
        <span><i class="sw full"></i>Dolu</span>
        <span><i class="sw mine"></i>Kayıtlısın</span>
        <span><i class="sw past"></i>Geçti</span></div>

      ${mineAll.length ? `<div class="mysec">
        <div class="sdh">Yaklaşan randevuların</div>
        ${mineAll.map(x=>`<div class="myrow">
          <span class="num" style="font-weight:600;width:78px">${fmtDate(new Date(x.dISO))}</span>
          <span style="flex:1;min-width:0"><b style="display:block;font-size:13.5px">${
            esc(svc(x.k.serviceId)?.name)}</b>
            <span class="lbl num">${x.k.time}${x.b.status==='waitlist'?' · bekleme listesinde':''}</span></span>
          <button class="btn sm" data-sc="${x.b.id}">İptal</button></div>`).join('')}
      </div>`:''}
    </div>
  </div>`;

  $('#who').onchange = e => { stuId = e.target.value; stuDay = 0; route(); };
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{ stuDay=+b.dataset.day; route(); });
  document.querySelectorAll('[data-sb]').forEach(b=>b.onclick=()=>memberBook(b.dataset.sb));
  document.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>lock(b, ()=>memberCancel(b.dataset.sc)));
}

function memberBook(key){
  const [sid, dISO] = key.split('|');
  const ser = DB.series.find(x=>x.id===sid) || (DB.extra||[]).find(x=>x.id===sid);
  const s = svc(ser.serviceId), cp = capOf(s);
  const bk = bookingsOf(key);
  const free = cp - bk.filter(b=>b.status!=='waitlist').length;
  const blocks = bookingBlocks(stuId, key, ser.serviceId, dISO, ser.time);
  const d = new Date(dISO+'T00:00:00');

  // Engel varsa üyeye açıkça söyle — sessiz başarısızlık yok
  if (blocks.length && free > 0){
    return toast(blocks[0], true);
  }

  openModal(`<div class="mhead"><div class="row sp">
      <div><div style="font-weight:600;font-size:16px">${esc(s?.name)}</div>
      <div class="lbl">${TR_FULL[d.getDay()]} ${fmtDate(d)} · ${ser.time}</div></div>
      <button class="btn sm" data-close aria-label="Kapat">✕</button></div></div>
    <div class="mbody">
      <ul class="ledger" style="margin-bottom:14px">
        <li><span>Eğitmen</span><span>${esc(trn(ser.trainerId)?.name||'—')}</span></li>
        <li><span>Süre</span><span>${s?.dur||50} dk</span></li>
        <li><span>Durum</span><span>${free>0?`${free} yer boş`:'Dolu'}</span></li>
      </ul>
      ${free>0
        ? `<button class="btn go" id="ok" style="width:100%">Randevuyu al</button>
           ${(()=>{
             /* Genel kural yerine BU derse özel son an. Üye "12 saat" diye
                okuyup sonra cezalandırılmasın. */
             const bas = new Date(dISO+'T'+ser.time);
             const sonAn = new Date(bas.getTime() - rules().lateHours*3600000);
             const gecti = sonAn <= new Date();
             return gecti
               ? `<div class="sumbox warnbox" style="margin-top:10px">${
                   T('Bu dersi aldıktan sonra iptal edersen hakkın yanar — ücretsiz iptal süresi geçmiş.',
                     'If you cancel after booking this class your credit is lost — the free-cancellation window has passed.')}</div>`
               : `<p class="lbl" style="margin:10px 0 0">${T('Onaylayınca 1 ders hakkın düşer.',
                   'Confirming uses one class credit.')}<br>${
                   T(`Ücretsiz iptal için son an: ${fmtDate(sonAn)} ${
                       String(sonAn.getHours()).padStart(2,'0')}:${String(sonAn.getMinutes()).padStart(2,'0')}`,
                     `Free cancellation until ${fmtDate(sonAn)} ${
                       String(sonAn.getHours()).padStart(2,'0')}:${String(sonAn.getMinutes()).padStart(2,'0')}`)}</p>`;
           })()}`
        : blocks.length
          ? `<div class="hint" style="margin:0">${esc(blocks[0])}</div>`
          : `<button class="btn" id="ok" style="width:100%">Bekleme listesine yazıl</button>
             <p class="lbl" style="margin:10px 0 0">Yer açılırsa sırayla haber verilir.
               Bekleme listesinde hak düşmez.</p>`}
    </div>`);

  bindLock('#ok', ()=>{
    const again = bookingBlocks(stuId, key, ser.serviceId, dISO, ser.time);
    const wait = free <= 0;
    if (!wait && again.length){ closeAll(); return toast(again[0], true); }
    const p = planOf(stuId, ser.serviceId, dISO);
    if (!wait && !p){ closeAll(); return toast('Kullanılabilir paketin yok', true); }
    const nb = { id:uid(), key, memberId:stuId, planId:p?.id||null, status:'new' };
    DB.bookings.push(nb);
    settleBooking(nb, wait ? 'waitlist' : 'booked');
    logAct('uye_rezervasyon', `${mem(stuId).name} · ${s?.name} · ${fmtDate(d)} ${ser.time}`);
    save(); closeAll(); route();
    toast(wait ? 'Bekleme listesine yazıldın' : 'Randevun alındı');
  });
}

/* Üye iptali — önce onay. Tek dokunuşla hak yakmak kabul edilemez;
   üç ayrı kullanıcı testinde de ilk şikâyet buydu. */
function memberCancel(bid){
  const b = DB.bookings.find(x=>x.id===bid);
  if (!b) return;
  const yanar = b.status !== 'waitlist' && isLate(b.key) && rules().chargeLate;
  const [sid, dISO] = String(b.key).split('|');
  const ser = DB.series.find(x=>x.id===sid) || (DB.extra||[]).find(x=>x.id===sid);
  const s = svc(ser?.serviceId);
  const d = ser ? new Date(dISO+'T00:00:00') : null;
  askConfirm({
    title: T('Randevunu iptal et','Cancel your booking'),
    body: `<b>${esc(s?.name||'')}</b>${d ? ` · ${TR_FULL[d.getDay()]} ${fmtDate(d)} ${ser.time}` : ''}<br><br>` +
      (b.status === 'waitlist'
        ? T('Bekleme listesinden çıkacaksın. Hakkın etkilenmez.',
            'You will be removed from the waitlist. Your credits are not affected.')
        : yanar
          ? `<b style="color:var(--stop)">${T('Bu ders hakkın iade edilmeyecek.',
              'This class credit will not be refunded.')}</b> ` +
            T(`Derse ${rules().lateHours} saatten az kaldı.`,
              `There are less than ${rules().lateHours} hours until the class.`)
          : T('Ders hakkın iade edilecek.','Your class credit will be refunded.')),
    danger: T('Randevuyu iptal et','Cancel booking'),
    cancel: T('Vazgeç','Keep it'),
    onOk: () => memberCancelDo(bid)
  });
}
function memberCancelDo(bid){
  const b = DB.bookings.find(x=>x.id===bid);
  if (!b) return;
  const late = isLate(b.key) && rules().chargeLate;
  settleBooking(b, late ? 'late_cancel' : 'cancelled');
  promoteWaitlist(b.key);
  logAct('uye_iptal', `${mem(b.memberId).name}`);
  save(); route();
  toast(!b.planId ? 'Bekleme listesinden çıkarıldın'
    : late ? `İptal edildi — derse ${rules().lateHours} saatten az kaldığı için hakkın iade edilmedi`
           : 'İptal edildi, hakkın iade edildi');
}

/* Yer açılınca bekleme listesindeki ilk kişiyi derse al */
function promoteWaitlist(key){
  const [sid] = key.split('|');
  const ser = DB.series.find(x=>x.id===sid) || (DB.extra||[]).find(x=>x.id===sid);
  if (!ser) return;
  const cp = capOf(svc(ser.serviceId));
  const act = bookingsOf(key).filter(b=>b.status!=='waitlist');
  if (act.length >= cp) return;
  const next = DB.bookings.find(b=>b.key===key && b.status==='waitlist');
  if (!next) return;
  const p = planOf(next.memberId, ser.serviceId, key.split('|')[1]);
  if (!p) return;                       // hakkı yoksa sırada bekler
  next.planId = p.id;
  settleBooking(next, 'booked');
  logAct('bekleme_terfi', mem(next.memberId).name);
  toast(`${firstN(mem(next.memberId).name)} bekleme listesinden derse alındı`);
}


/* =====================================================================
   ARANABİLİR SEÇİCİ
   Açılır liste 200 üyede kullanılamaz. Yazarak süz, dokunarak seç.
   ===================================================================== */
function pickerModal({ title, sub, items, onPick, onNew, newLabel, empty }){
  let q = '';
  const render = () => {
    const t = q.toLocaleLowerCase('tr');
    const shown = items.filter(x => !t || x.search.toLocaleLowerCase('tr').includes(t));
    $('#modal').innerHTML = `
    <div class="mhead"><div class="row sp">
      <div><div style="font-weight:600;font-size:16px">${esc(title)}</div>
      ${sub?`<div class="lbl">${esc(sub)}</div>`:''}</div>
      <button class="btn sm" data-close aria-label="Kapat">✕</button></div>
      <input id="pq" class="srch" style="margin:12px 0 0" value="${esc(q)}"
        placeholder="Ad veya telefon yaz…" autocomplete="off" inputmode="search"
        aria-label="Ara"></div>
    <div class="mbody" style="padding-top:8px">
      ${onNew?`<button class="pick newpick" id="pnew">
        <span class="qi">+</span><span class="nm">${esc(newLabel||'Yeni ekle')}</span></button>`:''}
      ${shown.length ? shown.slice(0,60).map(x=>`<button class="pick" data-p="${x.id}">
        <span><span class="nm">${x.label}</span>${x.sub?`<br><span class="sub">${x.sub}</span>`:''}</span>
        ${x.right?`<span class="rt">${x.right}</span>`:''}</button>`).join('')
        : `<div class="empty-note">${esc(q ? 'Eşleşen kayıt yok.' : (empty||'Kayıt yok.'))}</div>`}
      ${shown.length>60?`<p class="lbl" style="text-align:center;margin:10px 0 0">
        İlk 60 sonuç gösteriliyor — aramayı daralt.</p>`:''}
    </div>`;
    $('#modal').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeAll);
    const inp = $('#pq');
    inp.oninput = () => { const pos = inp.selectionStart; q = inp.value; render();
      const el = $('#pq'); el.focus(); el.setSelectionRange(pos,pos); };
    inp.onkeydown = e => {
      if (e.key === 'Enter' && shown.length === 1){ closeAll(); onPick(shown[0].id); }
    };
    $('#modal').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
      closeAll(); onPick(b.dataset.p); });
    const nb = $('#pnew'); if (nb) nb.onclick = () => { closeAll(); onNew(q); };
  };
  openModal('<div class="mbody"></div>');
  render();
  setTimeout(()=>$('#pq')?.focus(), 60);
}

/* Üye seçici — her yerde aynı */
function pickMember(title, onPick, opts={}){
  const items = DB.members
    .filter(m=>!opts.exclude?.includes(m.id))
    .map(m=>{
      const p = anyPlan(m.id), l = left(p);
      const st = standingOf(m.id);
      return { id:m.id, search:`${m.name} ${m.phone||''}`,
        label: esc(m.name) + (st?' <span class="tag plum">sabit</span>':''),
        sub: `${showPhone(m.phone)||'telefon yok'}${p?` · ${l} hak`:' · paketsiz'}`,
        right: p ? `<span class="tag ${l<=2?'warn':'go'}">${l}</span>`
                 : '<span class="tag mute">paketsiz</span>' };
    })
    .sort((a,b)=>a.search.localeCompare(b.search,'tr'));

  pickerModal({ title, sub:opts.sub, items, onPick,
    onNew: opts.allowNew===false ? null : (q)=>memberModal({ prefill:q, onDone:onPick }),
    newLabel:'Yeni üye ekle', empty:'Henüz üye yok.' });
}

/* =====================================================================
   YENİ ÜYE ZİNCİRİ
   Üye ekle → paket sat → sabit program. Her adım atlanabilir.
   Teknolojiyle arası olmayan biri için tek yol: sistem sırayı kendisi sorar.
   ===================================================================== */
function startMemberChain(prefill){
  memberModal({ prefill, onDone:(mid)=>chainStep2(mid) });
}
function chainStep2(mid){
  const m = mem(mid);
  openModal(`<div class="mhead"><div class="row sp">
      <div><div style="font-weight:600;font-size:16px">${esc(m.name)} eklendi</div>

/* =====================================================================
   HATIRLATMALAR
   Sunucu olmadan gerçek push gönderilemez. İki şey yapılabilir:
   1) uygulama açıkken tarayıcı bildirimi
   2) tek dokunuşla WhatsApp mesajı — resepsiyon gönderir
   ===================================================================== */
function remindersFor(dISO){
  const out = [];
  classesOn(dISO).filter(k=>!k.cancelled).forEach(k=>{
    const ser = svc(k.serviceId);
    bookingsOf(k.key).filter(b=>b.status==='booked').forEach(b=>{
      const m = mem(b.memberId);
      if (!m?.phone) return;
      out.push({ bookingId:b.id, memberId:m.id, name:m.name, phone:m.phone,
        time:k.time, service:ser?.name, dISO,
        sent: b.reminded === dISO });
    });
  });
  return out.sort((a,b)=>a.time.localeCompare(b.time));
}

function waLink(r){
  const d = new Date(r.dISO+'T00:00:00');
  const bugun = r.dISO === iso(new Date());
  const yarin = r.dISO === iso(addDays(new Date(),1));
  const msg = isEN()
    ? (() => {
        const gun = bugun ? 'today' : yarin ? 'tomorrow'
                  : `on ${TR_FULL[d.getDay()]}, ${fmtDate(d)}`;
        return `Hi ${firstN(r.name)}, you have ${r.service} at ${r.time} ${gun}. ` +
               `See you at ${DB.studio.name}.`;
      })()
    : (() => {
        const gun = bugun ? 'bugün' : yarin ? 'yarın'
                  : `${fmtDate(d)} ${TR_FULL[d.getDay()]}`;
        return `Merhaba ${firstN(r.name)}, ${gun} saat ${r.time} ${r.service} dersin var. ` +
               `${DB.studio.name} olarak seni bekliyoruz.`;
      })();
  return `https://wa.me/${String(r.phone).replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`;
}

function reminderSheet(dISO){
  const list = remindersFor(dISO);
  const d = new Date(dISO+'T00:00:00');
  openDrawer(`<div class="dhead"><div class="row sp">
      <div><h2 style="font-size:19px">Hatırlatmalar</h2>

        <span class="lm"><b>${esc(r.name)}</b>

      ${list.some(r=>!r.sent)?`<button class="btn" id="allsent" style="width:100%;margin-top:14px">

let notifTimer = null;
async function nativeBackup(name){
  try {

    const Filesystem = cap.registerPlugin('Filesystem'), Share = cap.registerPlugin('Share');
    const r = await Filesystem.writeFile({ path: name, data: JSON.stringify(DB,null,2),
      directory: 'CACHE', encoding: 'utf8' });
    await Share.share({ title: 'PİL yedeği', files: [r.uri], dialogTitle: 'Yedeği kaydet veya gönder' });

  } catch (err) {

  }

function armNotifications(){
  if (!('Notification' in window)) return;
  clearInterval(notifTimer);
  notifTimer = setInterval(()=>{
    if (Notification.permission !== 'granted') return;
    const dISO = iso(new Date());
    const nowM = new Date().getHours()*60 + new Date().getMinutes();
    classesOn(dISO).filter(k=>!k.cancelled).forEach(k=>{
      const diff = minutes(k.time) - nowM;
      if (diff !== 30 && diff !== 10) return;
      const n = bookingsOf(k.key).filter(b=>b.status==='booked').length;
      const tag = 'pil-'+k.key+'-'+diff;
      if (sessionStorage.getItem(tag)) return;
      try {
        new Notification(`${k.time} ${svc(k.serviceId)?.name}`,
          { body:`${diff} dakika sonra · ${n} kayıt`, tag, icon:'icon-192.png' });
        sessionStorage.setItem(tag,'1');
      } catch(e){}
    });
  }, 60000);
}
function askNotifPermission(){
  if (!('Notification' in window)) return toast('Bu tarayıcı bildirim desteklemiyor', true);
  Notification.requestPermission().then(p=>{
    if (p === 'granted'){ armNotifications(); save(); toast('Bildirimler açıldı'); route(); }
    else toast('Bildirim izni verilmedi', true);
  });
}

/* =====================================================================
   SABİT PROGRAM
   Üye "her Pazartesi, Çarşamba, Cuma 09:00" gibi bir haftalık program
   seçer; rezervasyonlar ileriye dönük otomatik üretilir.

   Kurallar:
   · Yalnızca kalan hak kadar ileri gidilir — paket bitince üretim durur.
   · Dolu ders atlanır, sessizce bekleme listesine atılmaz.
   · Üye tek bir haftayı iptal ederse o ders tekrar üretilmez.
   · Kapalı günler ve iptal edilen dersler atlanır.
   ===================================================================== */
const STANDING_WEEKS = 8;        // en fazla kaç hafta ileri üretilir

const standingOf = mid => (DB.standing||[]).find(x=>x.memberId===mid && x.active);

function standingLabel(st){
  return (st.slots||[]).map(id=>{
    const ser = DB.series.find(x=>x.id===id);
    return ser ? `${TR_DAY[ser.weekday]} ${ser.time}` : null;
  }).filter(Boolean).join(' · ');
}

/* Sabit programı ileriye doğru işler. Dönen nesne kullanıcıya rapor edilir. */
function applyStanding(st, opts={}){
  const res = { created:0, skippedFull:0, skippedClosed:0, stoppedNoCredit:false };
  if (!st || !st.active || !st.slots?.length) return res;

  const startISO = opts.from || iso(new Date());
  const limit = st.until || iso(addDays(new Date(), STANDING_WEEKS*7));

  for (let i = 0; i <= STANDING_WEEKS*7; i++){
    const d = addDays(new Date(startISO+'T00:00:00'), i);
    const dISO = iso(d);
    if (dISO > limit) break;

    for (const sid of st.slots){
      const ser = DB.series.find(x=>x.id===sid);
      if (!ser || ser.weekday !== d.getDay()) continue;

      const key = sid + '|' + dISO;
      // Bu üye için daha önce oluşturulmuş (iptal edilmiş olsa bile) kayıt varsa dokunma
      if (DB.bookings.some(b=>b.key===key && b.memberId===st.memberId)) continue;
      if (!rules().rollForward && res.created > 0 && res.stoppedNoCredit) continue;
      if ((DB.closed||[]).includes(dISO)) { res.skippedClosed++; continue; }
      if (DB.off.some(o=>o.seriesId===sid && o.date===dISO)) { res.skippedClosed++; continue; }
      if (new Date(dISO+'T'+ser.time) < new Date()) continue;   // geçmiş

      const p = planOf(st.memberId, ser.serviceId, dISO);
      if (!p || left(p) <= 0){ res.stoppedNoCredit = true; continue; }

      const cp = capOf(svc(ser.serviceId));
      const n = bookingsOf(key).filter(b=>b.status!=='waitlist').length;
      if (n >= cp){ res.skippedFull++; continue; }

      const nb = { id:uid(), key, memberId:st.memberId, planId:p.id,
                   status:'new', standingId:st.id };
      DB.bookings.push(nb);
      settleBooking(nb, 'booked');
      res.created++;
    }
  }
  return res;
}

/* Uygulama açılışında ve paket satışından sonra ileriye doğru tamamlar */
function topUpStanding(){
  let total = 0;
  (DB.standing||[]).filter(x=>x.active).forEach(st=>{ total += applyStanding(st).created; });
  if (total) save();
  return total;
}

/* Sabit programı durdur — gelecekteki kayıtlar isteğe bağlı silinir */
function stopStanding(stId, removeFuture){
  const st = (DB.standing||[]).find(x=>x.id===stId);
  if (!st) return 0;
  st.active = false;
  let n = 0;
  if (removeFuture){
    const now = new Date();
    DB.bookings.filter(b=>b.standingId===stId && ['booked','waitlist'].includes(b.status))
      .forEach(b=>{
        const [sid, dISO] = b.key.split('|');
        const ser = DB.series.find(x=>x.id===sid);
        if (!ser || new Date(dISO+'T'+ser.time) <= now) return;
        settleBooking(b, 'cancelled', 'refund'); n++;
        promoteWaitlist(b.key);
      });
  }
  logAct('sabit_program_durduruldu', `${mem(st.memberId)?.name} · ${n} kayıt iptal`);
  return n;
}

/* Seçim penceresi — haftalık programdan tıklayarak saat seç */

      .filter(d=>d.list.length);

    const p = anyPlan(mid), l = left(p);
    const perWeek = sel.length;

    $('#modal').innerHTML = `
    <div class="mhead"><div class="row sp">

    <div class="mbody">

      ${byDay.map(d=>`<div class="stday">

        <div class="stslots">${d.list.map(x=>{
          const sv = svc(x.serviceId);
          return `<button type="button" class="stchip ${sel.includes(x.id)?'on':''}"
            data-s="${x.id}" aria-pressed="${sel.includes(x.id)}">
            <b class="num">${x.time}</b><span>${esc(shortSvc(sv?.name))}</span></button>`;
        }).join('')}</div></div>`).join('')
        || '<div class="empty-note">Haftalık ders programı boş.</div>'}

      ${sel.length ? `<div class="stsum">
        <div class="row sp"><span>Haftada</span><b>${perWeek} ders</b></div>
        <div class="row sp"><span>Seçilen saatler</span>
          <b style="text-align:right">${esc(sel.map(id=>{
            const ser = DB.series.find(x=>x.id===id);
            return ser?`${TR_DAY[ser.weekday]} ${ser.time}`:'';
          }).filter(Boolean).join(', '))}</b></div>
        <div class="row sp"><span>Mevcut hakla yeter</span>
          <b>${p ? `${weeks} hafta` : 'paket gerekli'}</b></div>
      </div>

      <div class="field" style="margin-top:12px"><label for="un">Bitiş tarihi (isteğe bağlı)</label>
        <input id="un" type="date" value="${until}">
        <p class="lbl" style="margin:5px 0 0">Boş bırakırsan paket hakkı bitene kadar devam eder.</p></div>

      <button class="btn go" id="ok" style="width:100%">
        ${cur?'Programı güncelle':'Sabit programı başlat'}</button>
      ${cur?`<button class="btn stop" id="stop" style="width:100%;margin-top:8px">
        Sabit programı durdur</button>`:''}
      ` : '<p class="lbl" style="margin:12px 0 0">Devam etmek için en az bir saat seç.</p>'}
    </div>`;

    $('#modal').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeAll);
    $('#modal').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{
      const i = sel.indexOf(b.dataset.s);
      i<0 ? sel.push(b.dataset.s) : sel.splice(i,1);
      render(); });
    const un = $('#un'); if (un) un.onchange = e => { until = e.target.value; };

    bindLock('#ok', ()=>{
      if (!anyPlan(mid))
        return toast('Önce bu üyeye paket sat', true);
      if (cur){ cur.slots = sel; cur.until = until || null; cur.active = true; }
      else DB.standing.push({ id:uid(), memberId:mid, slots:sel,
                              from:iso(new Date()), until: until || null, active:true });
      const st = standingOf(mid);
      const r = applyStanding(st);
      logAct('sabit_program', `${m.name} · ${standingLabel(st)} · ${r.created} rezervasyon`,
             { kind:'standing', standingId:st.id });
      save(); closeAll(); route();

      let msg = `${r.created} rezervasyon oluşturuldu`;
      if (r.skippedFull) msg += ` · ${r.skippedFull} ders dolu olduğu için atlandı`;
      if (r.stoppedNoCredit) msg += ' · hak bitince durdu';
      toast(msg, r.skippedFull > 0);
    });

    const sb = $('#stop');
    if (sb) sb.onclick = () => {
      const future = DB.bookings.filter(b=>b.standingId===cur.id
        && ['booked','waitlist'].includes(b.status)).length;
      askConfirm({ title:'Sabit programı durdur',
        body:`${esc(m.name)} için ileriye dönük <b>${future} rezervasyon</b> var.

        danger:'İptal et ve durdur', cancel:'Kayıtlar kalsın',
        onOk:()=>{ const n = stopStanding(cur.id, true); save(); route();
          toast(`Program durduruldu, ${n} rezervasyon iptal edildi`); }});
    };
  };

  openModal('<div class="mbody"></div>');
  render();
}

      <label class="row" style="gap:9px;margin:4px 0 14px;cursor:pointer">
        <input type="checkbox" id="sp" ${DB.studio.showPrice?'checked':''}

      <p class="lbl" style="margin:-8px 0 12px">Kapalıyken öğrenci yalnızca kalan ders hakkını görür;
        fiyat, borç ve tahsilat bilgisi yalnızca sana görünür.</p>
      <button class="btn" id="ss">Kaydet</button></div>

    <div class="card pad" style="margin-bottom:12px">
      <h3 style="font-size:15px;margin-bottom:4px">Dil ve para birimi</h3>
      <p class="lbl" style="margin:0 0 14px">Arayüz dili, para birimi ve telefon ülke kodu.
        Kayıtlı veriler değişmez.</p>
      <div class="field"><label for="slang">Dil</label>
        <select id="slang">${Object.keys(LANGS).map(k=>
          `<option value="${k}" ${lang()===k?'selected':''}>${LANGS[k]}</option>`).join('')}</select></div>
      <div class="row" style="gap:10px">
        <div class="field" style="flex:1"><label for="scur">Para birimi</label>
          <select id="scur">${Object.keys(CURRENCIES).map(k=>
            `<option value="${k}" ${curCode()===k?'selected':''}>${CURRENCIES[k].sym} ${
              isEN()?CURRENCIES[k].en:CURRENCIES[k].ad}</option>`).join('')}</select></div>
        <div class="field" style="flex:1"><label for="scc">Telefon ülke kodu</label>
          <select id="scc">${PHONE_CC.map(([kod,ad])=>
            `<option value="${kod}" ${ccOf()===kod?'selected':''}>+${kod} ${ad}</option>`).join('')}</select></div></div>
      <p class="lbl" style="margin:-6px 0 12px">Örnek: ${money(5800)} · ${
        showPhone(normPhone(ccOf()==='90'?'5321112233':'5551234567')||'')}</p>
      <button class="btn" id="slsave">Kaydet</button></div>

    <div class="card pad" style="margin-bottom:12px" id="rulesec">
      <h3 style="font-size:15px;margin-bottom:4px">Ders hakkı kuralları</h3>
      <p class="lbl" style="margin:0 0 14px">Hangi durumda hakkın yanacağına sen karar verirsin.
        Her kaydı işlerken bu kuralı tek seferlik ezebilirsin.</p>

      <div class="field"><label>Hak ne zaman düşsün</label>
        <div class="chiprow">
          <button type="button" class="chip ${R.chargeOn==='booking'?'on':''}" data-r="chargeOn:booking">
            Rezervasyon anında</button>
          <button type="button" class="chip ${R.chargeOn==='attendance'?'on':''}" data-r="chargeOn:attendance">
            Derse katılınca</button></div>
        <p class="lbl" style="margin:6px 0 0">${R.chargeOn==='booking'
          ? 'Yer ayrıldığı anda hak düşer — 2 hakkı olan 8 derse yazılamaz.'
          : 'Hak yalnızca gelen için düşer, ama üye hakkından fazla derse yazılabilir.'}</p></div>

      <label class="rrow2"><input type="checkbox" data-rb="chargeNoShow" ${R.chargeNoShow?'checked':''}>
        <span><b>Gelmeyenden hak yansın</b><br>
        <span class="lbl">Haber vermeden gelmeyen üyenin hakkı iade edilmez.</span></span></label>

      <label class="rrow2"><input type="checkbox" data-rb="chargeLate" ${R.chargeLate?'checked':''}>
        <span><b>Geç iptalde hak yansın</b><br>
        <span class="lbl">Aşağıdaki süreden az kala yapılan iptallerde hak iade edilmez.</span></span></label>

      <div class="field" style="margin-top:10px"><label for="lh">Geç iptal sınırı (saat)</label>
        <input id="lh" type="number" inputmode="numeric" min="0" max="72" value="${R.lateHours}"
          style="max-width:130px"></div>

      <label class="rrow2"><input type="checkbox" data-rb="refundStudioCancel" ${R.refundStudioCancel?'checked':''}>
        <span><b>Stüdyo iptalinde hak iade edilsin</b><br>
        <span class="lbl">Dersi sen iptal ettiğinde veya günü kapattığında herkesin hakkı geri yüklenir.</span></span></label>

      <label class="rrow2"><input type="checkbox" data-rb="rollForward" ${R.rollForward?'checked':''}>
        <span><b>İade edilen hak ileri taşınsın</b><br>
        <span class="lbl">Sabit programda iptal edilen ders, paketin sonuna eklenir.</span></span></label>

      <label class="rrow2"><input type="checkbox" data-rb="expireCredits" ${R.expireCredits?'checked':''}>
        <span><b>Süre dolunca kalan hak yansın</b><br>
        <span class="lbl">Kapalıysa süresi biten pakette kalan haklar kullanılabilir kalır.</span></span></label>

      <button class="btn pri" id="saverules" style="width:100%;margin-top:12px">Kuralları kaydet</button>
    </div>

    <div class="card pad" style="margin-bottom:12px">
      <div class="row sp" style="margin-bottom:11px">
        <h3 style="font-size:15px">Eğitmenler</h3>
        <button class="btn sm" data-newt>Ekle</button></div>
      ${DB.trainers.map(t=>`<div class="mini"><span>${esc(t.name)}</span>
        <span style="margin-left:auto;display:flex;gap:6px">
          <button class="btn sm" data-et="${t.id}">Düzenle</button>
          <button class="btn sm stop" data-dt="${t.id}">Sil</button></span></div>`).join('')
        || '<p class="lbl">Eğitmen yok</p>'}</div>

    <div class="card pad" style="margin-bottom:12px">
      <div class="row sp" style="margin-bottom:11px">
        <h3 style="font-size:15px">Salonlar</h3>
        <button class="btn sm" data-newr>Ekle</button></div>
      ${DB.rooms.map(r=>`<div class="mini"><span>${esc(r.name)}</span>
        <span class="lbl">${r.cap} ${esc(r.unit.toLocaleLowerCase('tr'))}</span>
        <span style="margin-left:auto;display:flex;gap:6px">
          <button class="btn sm" data-er="${r.id}">Düzenle</button>
          ${DB.rooms.length>1?`<button class="btn sm stop" data-dr="${r.id}">Sil</button>`:''}
        </span></div>`).join('')}
      <p class="lbl" style="margin:9px 0 0">Aynı saatte farklı salonlarda ders açabilmen için gerekli.</p></div>

    <div class="card pad" style="margin-bottom:12px">
      <div class="row sp" style="margin-bottom:11px">
        <h3 style="font-size:15px">Ders tipleri</h3>
        <button class="btn sm" data-news>Ekle</button></div>
      ${DB.services.map(s=>`<div class="mini"><span>${esc(s.name)}</span>
        <span class="lbl">${s.dur} dk · ${capOf(s)} kişi · ${esc(room(s.roomId)?.name||'—')}</span>
        <span style="margin-left:auto;display:flex;gap:6px">
          <button class="btn sm" data-es="${s.id}">Düzenle</button>
          <button class="btn sm stop" data-ds="${s.id}">Sil</button></span></div>`).join('')
        || '<p class="lbl">Ders tipi yok</p>'}</div>

    <div class="card pad" style="margin-bottom:12px">
      <div class="row sp" style="margin-bottom:11px">
        <h3 style="font-size:15px">Paketler</h3>
        <button class="btn sm" data-newp>Ekle</button></div>
      ${DB.packages.map(p=>`<div class="mini"><span>${esc(p.name)}</span>
        <span class="lbl">${p.count} ders · ${p.serviceIds?.length
          ? p.serviceIds.map(i=>esc(svc(i)?.name)).join(', ') : 'tüm dersler'}</span>
        <span class="miniact">
          <b>${money(p.price)}</b>
          <button class="btn sm" data-ep="${p.id}">Düzenle</button>
          <button class="btn sm stop" data-dp="${p.id}">Sil</button></span></div>`).join('')
        || '<p class="lbl">Paket yok</p>'}
      <p class="lbl" style="margin:9px 0 0">Fiyat değişikliği yalnızca yeni satışları etkiler;
        satılmış paketler kendi fiyatıyla kalır.</p></div>

    <div class="card pad" style="margin-bottom:12px">
      <h3 style="font-size:15px;margin-bottom:6px">Bildirimler</h3>
      <p class="lbl" style="margin:0 0 12px">Uygulama açıkken yaklaşan dersler için
        telefon bildirimi gösterilir. Uygulama kapalıyken bildirim göndermek sunucu gerektirir —
        şimdilik WhatsApp hatırlatmasını Bugün ekranından tek dokunuşla gönderebilirsin.</p>
      <button class="btn" id="notif">${
        (typeof Notification!=='undefined' && Notification.permission==='granted')
          ? 'Bildirimler açık' : 'Bildirimlere izin ver'}</button></div>

    <div class="card pad">
      <h3 style="font-size:15px;margin-bottom:6px">Yedekleme</h3>
      <p class="lbl" style="margin:0 0 12px">Veriler yalnızca bu tarayıcıda. Haftada bir yedek al.</p>
      <div class="row" style="gap:8px;flex-wrap:wrap">
        <button class="btn pri" id="exp">Yedek al</button>
        <button class="btn" id="imp">Geri yükle</button>
        <button class="btn stop" id="rst">Her şeyi sıfırla</button></div>
      <input type="file" id="file" accept="application/json" hidden>
      ${(()=>{ const b = lastBackup(); return b
        ? `<div class="mini" style="margin-top:12px">
             <span>Son otomatik yedek<div class="lbl">${fmtDate(new Date(b.at))}
               ${new Date(b.at).toLocaleTimeString(localeTag(),{hour:'2-digit',minute:'2-digit',hour12:false})}
               · ${esc(b.reason||'')}</div></span>
             <button class="btn sm" id="undo" style="margin-left:auto">Bu yedeğe dön</button></div>`
        : ''; })()}
      <p class="lbl" style="margin:10px 0 0">Veri şeması sürümü: v${DB.schemaVersion}.
        Sıfırlama ve geri yükleme öncesi otomatik kopya alınır.</p></div>`;

  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
    const [k,v] = b.dataset.r.split(':'); draft[k] = v;
    DB.studio.rules = { ...rules(), ...draft }; save(); route(); });
  document.querySelectorAll('[data-rb]').forEach(b=>b.onchange=()=>{
    draft[b.dataset.rb] = b.checked; });
  $('#saverules').onclick = () => {
    draft.lateHours = Math.min(Math.max(parseInt($('#lh').value)||0, 0), 72);
    DB.studio.rules = { ...rules(), ...draft };
    logAct('kurallar_guncellendi',
      `${draft.chargeOn==='booking'?'rezervasyonda':'katılımda'} düşer · ` +
      `gelmedi:${draft.chargeNoShow?'yanar':'iade'} · geç iptal:${draft.chargeLate?'yanar':'iade'}`);
    save(); route(); toast('Kurallar kaydedildi');
  };
  $('#ss').onclick = () => {
    DB.studio.name = $('#sn').value.trim() || DB.studio.name;
    DB.studio.unit = $('#su').value;
    const c = Math.max(1, parseInt($('#sc').value)||DB.studio.cap);
    DB.services.forEach(s=>{ if (s.cap === DB.studio.cap) s.cap = c; });
    DB.studio.cap = c;
    DB.studio.showPrice = $('#sp').checked;
    save(); renderShell(); route(); toast('Kaydedildi'); };

  $('#slsave').onclick = () => {
    const yeniDil = $('#slang').value;
    DB.studio.currency = $('#scur').value;
    DB.studio.cc       = $('#scc').value;
    DB.studio.lang     = yeniDil;
    document.documentElement.lang = yeniDil;
    save(); renderShell(); route();
    toast(yeniDil === 'en' ? 'Saved' : 'Kaydedildi'); };

  document.querySelectorAll('[data-newt]').forEach(b=>b.onclick=()=>editTrainer());
  document.querySelectorAll('[data-et]').forEach(b=>b.onclick=()=>editTrainer(b.dataset.et));
  document.querySelectorAll('[data-dt]').forEach(b=>b.onclick=()=>{
    if (DB.trainers.length<2) return toast('En az bir eğitmen kalmalı', true);
    const n = DB.series.filter(s=>s.trainerId===b.dataset.dt).length;
    if (n) return toast(`Bu eğitmenin programda ${n} dersi var, önce onları değiştir`, true);
    const t = trn(b.dataset.dt);
    askConfirm({ title:'Eğitmeni sil', body:`<b>${esc(t.name)}</b> silinecek.
      Geçmiş ders kayıtları etkilenmez.`, danger:'Sil',
      onOk:()=>{ DB.trainers = DB.trainers.filter(x=>x.id!==b.dataset.dt);
        logAct('egitmen_silindi', t.name); save(); route(); toast('Eğitmen silindi'); }}); });

  document.querySelectorAll('[data-newr]').forEach(b=>b.onclick=()=>editRoom());
  document.querySelectorAll('[data-er]').forEach(b=>b.onclick=()=>editRoom(b.dataset.er));
  document.querySelectorAll('[data-dr]').forEach(b=>b.onclick=()=>{
    const n = DB.services.filter(x=>x.roomId===b.dataset.dr).length;
    if (n) return toast(`Bu salonda ${n} ders tipi tanımlı, önce onları taşı`, true);
    const r = room(b.dataset.dr);
    askConfirm({ title:'Salonu sil', body:`<b>${esc(r.name)}</b> silinecek.`, danger:'Sil',
      onOk:()=>{ DB.rooms = DB.rooms.filter(x=>x.id!==b.dataset.dr);
        logAct('salon_silindi', r.name); save(); route(); toast('Salon silindi'); }}); });
  document.querySelectorAll('[data-news]').forEach(b=>b.onclick=()=>editService());
  document.querySelectorAll('[data-es]').forEach(b=>b.onclick=()=>editService(b.dataset.es));
  document.querySelectorAll('[data-ds]').forEach(b=>b.onclick=()=>{
    if (DB.services.length<2) return toast('En az bir ders tipi kalmalı', true);
    const n = DB.series.filter(s=>s.serviceId===b.dataset.ds).length;
    if (n) return toast(`Bu ders programda ${n} kez kullanılıyor, önce onları kaldır`, true);
    const sv = svc(b.dataset.ds);
    const pk = DB.packages.filter(p=>p.serviceIds?.includes(b.dataset.ds)).length;
    askConfirm({ title:'Ders tipini sil',
      body:`<b>${esc(sv.name)}</b> silinecek.${pk?` ${pk} pakette bu ders tanımlı,
        o paketler tüm derslerde geçerli hale gelir.`:''}`, danger:'Sil',
      onOk:()=>{ DB.services = DB.services.filter(x=>x.id!==b.dataset.ds);
        DB.packages.forEach(p=>{ p.serviceIds = (p.serviceIds||[]).filter(i=>i!==b.dataset.ds); });
        logAct('ders_tipi_silindi', sv.name); save(); route(); toast('Ders tipi silindi'); }}); });

  document.querySelectorAll('[data-newp]').forEach(b=>b.onclick=()=>editPackage());
  document.querySelectorAll('[data-ep]').forEach(b=>b.onclick=()=>editPackage(b.dataset.ep));
  document.querySelectorAll('[data-dp]').forEach(b=>b.onclick=()=>{
    const pk = DB.packages.find(p=>p.id===b.dataset.dp);
    const sold = DB.plans.filter(p=>p.name===pk.name).length;
    askConfirm({ title:'Paketi sil',
      body:`<b>${esc(pk.name)}</b> satış listesinden kaldırılacak.
        ${sold?`Daha önce satılmış <b>${sold} paket</b> etkilenmez, üyeler haklarını kullanmaya devam eder.`
              :'Bu paket hiç satılmamış.'}`, danger:'Sil',
      onOk:()=>{ DB.packages = DB.packages.filter(p=>p.id!==b.dataset.dp);
        logAct('paket_sablonu_silindi', pk.name); save(); route(); toast('Paket kaldırıldı'); }}); });

  const nb = $('#notif'); if (nb) nb.onclick = () => askNotifPermission();
  $('#exp').onclick = () => {
    const blob = new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `studyo-yedek-${iso(new Date())}.json`;
    if (window.Capacitor?.isNativePlatform?.()) { URL.revokeObjectURL(a.href); return nativeBackup(a.download); }
    a.click(); URL.revokeObjectURL(a.href);
    toast('Yedek indirildi'); };
  $('#imp').onclick = () => $('#file').click();
  const ub = $('#undo');
  if (ub) ub.onclick = () => {
    const b = lastBackup(); if (!b) return toast('Yedek bulunamadı', true);
    askConfirm({ title:'Otomatik yedeğe dön',
      body:`${fmtDate(new Date(b.at))} tarihli kopyaya dönülecek
            (${(b.data.members||[]).length} üye). Şu anki veri değiştirilecek.`,
      danger:'Geri dön',
      onOk:()=>{ const cur = DB; DB = migrate(b.data);
        try { localStorage.setItem(BAK, JSON.stringify({at:new Date().toISOString(),
          reason:'geri alma öncesi', data:cur})); } catch(e){}
        save(); renderShell(); route(); toast('Yedeğe dönüldü'); }});
  };
  $('#file').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      let d;
      try { d = JSON.parse(r.result); }
      catch(err){ return toast('Dosya bozuk: geçerli bir JSON değil', true); }
      // Yüzeysel değil gerçek doğrulama — yanlış dosya mevcut veriyi ezmesin
      const bad = !d || typeof d !== 'object' || !d.studio || !d.studio.name
        || !Array.isArray(d.members) || !Array.isArray(d.plans) || !Array.isArray(d.services);
      if (bad) return toast('Bu dosya bir stüdyo yedeği değil — veri korundu', true);

      askConfirm({
        title:'Yedekten geri yükle',
        body:`Yüklenecek yedek: <b>${esc(d.studio.name)}</b> ·
              ${(d.members||[]).length} üye · ${(d.plans||[]).length} paket.<br><br>
              Şu anki veri (<b>${DB.members.length} üye</b>) bununla değiştirilecek.
              Mevcut verinin kopyası otomatik alınır.`,
        danger:'Geri yükle',
        onOk:()=>{
          backupNow('geri yükleme öncesi');
          DB = migrate(d); save(); renderShell(); route();
          toast(DB._migratedFrom !== undefined
            ? `Yedek yüklendi ve v${DB._migratedFrom}→v${DB.schemaVersion} güncellendi`
            : 'Yedek geri yüklendi');
        }});
      e.target.value = '';
    };
    r.readAsText(f); };
  $('#rst').onclick = () => {
    const n = DB.members.length, pl = DB.plans.length;
    askConfirm({
      title:'Her şeyi sıfırla',
      body:`<b>${n} üye</b>, <b>${pl} paket</b> ve tüm ders programı silinecek.
            Silmeden önce otomatik yedek alınır; "Yedeği geri al" ile dönebilirsin.`,
      danger:'Sıfırla',
      onOk:()=>{
        backupNow('sıfırlama öncesi');
        DB = migrate(blank()); save();
        W = { step:0, name:'', unit:'Reformer', cap:8, trainers:[], services:[], packages:[] };
        renderWizard();
      }});
  };
}


function editRoom(id){
  const r = id ? DB.rooms.find(x=>x.id===id) : null;
  openModal(`<div class="mhead"><div class="row sp">
      <div style="font-weight:600;font-size:16px">${r?'Salonu düzenle':'Salon ekle'}</div>
      <button class="btn sm" data-close>Kapat</button></div></div>
    <div class="mbody">
      <div class="field"><label>Salon adı</label>
        <input id="n" value="${esc(r?.name||'')}" placeholder="Boks Salonu"></div>
      <div class="row" style="gap:10px">
        <div class="field" style="flex:1"><label>Kapasite</label>
          <input id="c" type="number" min="1" max="80" value="${r?.cap||12}"></div>
        <div class="field" style="flex:1"><label>Yerlerin adı</label>
          <select id="u">${UNITS.map(x=>`<option ${r?.unit===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
      <button class="btn pri" id="ok" style="width:100%">Kaydet</button></div>`);
  $('#n').focus();
  $('#ok').onclick = () => {
    const v = $('#n').value.trim(); if (!v) return toast('Salon adı gerekli', true);
    const c = Math.max(1, parseInt($('#c').value)||12), u = $('#u').value;
    if (r){ r.name=v; r.cap=c; r.unit=u; } else DB.rooms.push({ id:uid(), name:v, cap:c, unit:u });
    save(); closeAll(); route(); toast('Kaydedildi'); };
}

function editTrainer(id){
  const t = id ? DB.trainers.find(x=>x.id===id) : null;
  openModal(`<div class="mhead"><div class="row sp">
      <div style="font-weight:600;font-size:16px">${t?'Eğitmeni düzenle':'Eğitmen ekle'}</div>
      <button class="btn sm" data-close>Kapat</button></div></div>
    <div class="mbody"><div class="field"><label>Ad soyad</label>
      <input id="n" value="${esc(t?.name||'')}"></div>
      <button class="btn pri" id="ok" style="width:100%">Kaydet</button></div>`);
  $('#n').focus();
  $('#ok').onclick = () => {
    const v = $('#n').value.trim(); if (!v) return toast('Ad gerekli', true);
    if (t) t.name = v; else DB.trainers.push({ id:uid(), name:v });
    save(); closeAll(); route(); toast('Kaydedildi'); };
}

function editService(id, onDone){
  const s = id ? DB.services.find(x=>x.id===id) : null;
  openModal(`<div class="mhead"><div class="row sp">
      <div style="font-weight:600;font-size:16px">${s?'Dersi düzenle':'Ders tipi ekle'}</div>
      <button class="btn sm" data-close>Kapat</button></div></div>
    <div class="mbody">
      <div class="field"><label>Ders adı</label><input id="n" value="${esc(s?.name||'')}"></div>
      <div class="field"><label>Salon</label><select id="r">${DB.rooms.map(x=>
        `<option value="${x.id}" ${s?.roomId===x.id?'selected':''}>${esc(x.name)} (${x.cap} kişi)</option>`).join('')}</select></div>
      <div class="row" style="gap:10px">
        <div class="field" style="flex:1"><label>Süre (dk)</label>
          <input id="d" type="number" min="10" max="180" value="${s?.dur||50}"></div>
        <div class="field" style="flex:1"><label>Kaç kişilik</label>
          <input id="c" type="number" min="1" max="60" value="${s?.cap||DB.studio.cap}"></div></div>
      <p class="lbl" style="margin:0 0 12px">Özel ders için kapasiteyi 1 yap.
        Salon kapasitesinden küçük tutabilirsin.</p>
      <button class="btn pri" id="ok" style="width:100%">Kaydet</button></div>`);
  $('#n').focus();
  $('#ok').onclick = () => {
    const v = $('#n').value.trim(); if (!v) return toast('Ders adı gerekli', true);
    const dur = Math.max(10, parseInt($('#d').value)||50);
    const cap = Math.max(1, parseInt($('#c').value)||DB.studio.cap);
    const rid = $('#r').value;
    let yeniId = id;
    if (s){ s.name=v; s.dur=dur; s.cap=cap; s.roomId=rid; }
    else { yeniId = uid(); DB.services.push({ id:yeniId, name:v, dur, cap, roomId:rid }); }
    save(); closeAll();
    if (onDone) onDone(yeniId); else { route(); toast('Kaydedildi'); } };
}

function editPackage(id){
  const p = id ? DB.packages.find(x=>x.id===id) : null;
  openModal(`<div class="mhead"><div class="row sp">
      <div style="font-weight:600;font-size:16px">${p?'Paketi düzenle':'Paket ekle'}</div>
      <button class="btn sm" data-close>Kapat</button></div></div>
    <div class="mbody">
      <div class="field"><label>Paket adı</label><input id="n" value="${esc(p?.name||'')}" placeholder="10 Ders"></div>
      <div class="row" style="gap:10px">
        <div class="field" style="flex:1"><label>Ders sayısı</label>
          <input id="c" type="number" min="1" max="200" value="${p?.count||10}"></div>
        <div class="field" style="flex:1"><label>Geçerlilik (gün)</label>
          <input id="g" type="number" min="7" max="730" value="${p?.days||90}"></div></div>
      <div class="field"><label>${T('Fiyat','Price')} (${CURRENCIES[curCode()].sym})</label>
        <input id="f" type="number" min="0" step="50" value="${p?.price||0}"></div>
      <div class="lbl" id="per" style="margin-bottom:10px"></div>
      <div class="field"><label>Hangi derslerde geçerli</label>
        <div class="chiprow">${DB.services.map(x=>
          `<button type="button" class="chip ${p?.serviceIds?.includes(x.id)?'on':''}"
            data-sc="${x.id}" aria-pressed="${p?.serviceIds?.includes(x.id)}">${esc(x.name)}</button>`).join('')}</div>
        <p class="lbl" style="margin:6px 0 0">Hiçbiri seçili değilse paket tüm derslerde geçerli olur.
          Branşa özel paket satıyorsan mutlaka seç.</p></div>
      <button class="btn pri" id="ok" style="width:100%">Kaydet</button></div>`);
  const per = () => { const c=+$('#c').value||1, f=+$('#f').value||0;
    $('#per').textContent = `Ders başına ${money(Math.round(f/c))}`; };
  $('#c').oninput = per; $('#f').oninput = per; per(); $('#n').focus();
  let scope = p?.serviceIds ? [...p.serviceIds] : [];
  $('#modal').querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{
    const i = scope.indexOf(b.dataset.sc);
    i<0 ? scope.push(b.dataset.sc) : scope.splice(i,1);
    b.classList.toggle('on', i<0); });
  $('#ok').onclick = () => {
    const v = $('#n').value.trim(); if (!v) return toast('Paket adı gerekli', true);
    const count = Math.max(1, parseInt($('#c').value)||10);
    const days = Math.max(7, parseInt($('#g').value)||90);
    const price = Math.max(0, parseInt($('#f').value)||0);
    if (p){ p.name=v; p.count=count; p.days=days; p.price=price; p.serviceIds=scope; }
    else DB.packages.push({ id:uid(), name:v, count, days, price, serviceIds:scope });
    save(); closeAll(); route(); toast('Kaydedildi'); };
}



/* =====================================================================
   MODAL / DRAWER
   ===================================================================== */
/* Merkezi pencere yöneticisi.
   Kapanma yolları: Kapat butonu, X, arka plan, Escape, başarılı işlem, sayfa değişimi.
   Açıkken arka plandaki gezinme kilitlenir. */
let modalOpen = false;

function openModal(html){
  const m = $('#modal');
  m.innerHTML = html;
  m.classList.add('on'); $('#scrim').classList.add('on');
  modalOpen = true;
  document.body.style.overflow = 'hidden';
  m.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeAll);
  // ilk odaklanabilir alana odaklan — klavye kullanımı için
  const f = m.querySelector('input,select,textarea,button:not([data-close])');
  if (f && f.focus) setTimeout(()=>f.focus(), 30);
}

function openDrawer(html){
  const d = $('#drawer');
  d.innerHTML = html;
  d.classList.add('on'); $('#scrim').classList.add('on');
  modalOpen = true;
  document.body.style.overflow = 'hidden';
  d.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeAll);
}

function closeAll(){
  $('#modal').classList.remove('on');
  $('#drawer').classList.remove('on');
  $('#scrim').classList.remove('on');
  $('#modal').innerHTML = '';        // form state'i tamamen temizlenir
  modalOpen = false;
  document.body.style.overflow = '';
}

$('#scrim').onclick = closeAll;
document.addEventListener('keydown', e=>{ if (e.key === 'Escape' && modalOpen) closeAll(); });

/* Çift tıklama kilidi — kritik işlemler iki kez çalışmaz.
   Buton işlem boyunca disabled ve "…" metniyle bekler. */
function lock(btn, fn){
  if (!btn || btn.disabled) return;
  btn.disabled = true;
  const old = btn.textContent;
  btn.textContent = 'İşleniyor…';
  try { fn(); }
  finally {
    // Başarılı işlemler pencereyi kapattığı için buton çoğu zaman DOM'dan düşer;
    // düşmediyse eski haline döner.
    if (btn.isConnected){ btn.disabled = false; btn.textContent = old; }
  }
}
function bindLock(sel, fn){
  const b = $(sel); if (!b) return;
  b.onclick = () => lock(b, fn);
}

/* Onay penceresi — silme, iptal ve kapatma işlemleri için tek biçim */
function askConfirm({ title, body, danger='Onayla', cancel='Vazgeç', onOk }){
  openModal(`<div class="mhead"><div class="row sp">
      <div style="font-weight:600;font-size:16px">${title}</div>
      <button class="btn sm" data-close aria-label="Kapat">✕</button></div></div>
    <div class="mbody">
      <p style="margin:0 0 16px;font-size:14.5px;line-height:1.55">${body}</p>
      <div class="row" style="gap:8px">
        <button class="btn" data-close style="flex:1">${cancel}</button>
        <button class="btn stop" id="cok" style="flex:1">${danger}</button></div></div>`);
  bindLock('#cok', ()=>{ closeAll(); onOk(); });
}

/* Geri alınabilir bildirim — 30 saniye */
let undoTimer = null;
function toastUndo(msg, fn, ms=30000){
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>
    <button id="undoBtn" style="margin-left:14px;text-decoration:underline;font-weight:600">Geri al</button>`;
  t.classList.remove('bad'); t.classList.add('on');
  clearTimeout(t._t); clearTimeout(undoTimer);
  const close = () => { t.classList.remove('on'); t.textContent=''; };
  $('#undoBtn').onclick = () => { clearTimeout(undoTimer); close(); fn(); };
  undoTimer = setTimeout(close, ms);
}

/* =====================================================================
   BAŞLAT
   ===================================================================== */
/* PWA — mağaza sarmalayıcıları (TWA / Capacitor) bunu bekler */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

/* Tarayıcının kendiliğinden kaydırma konumu geri yüklemesini kapat —
   iOS Safari'de sayfa açılırken üst kısım görünmez oluyordu. */
if (typeof history !== 'undefined' && 'scrollRestoration' in history)
  history.scrollRestoration = 'manual';

load();
document.documentElement.lang = lang();
startLocalizer();                   // dil İngilizceyse çeviriyi DOM üstünde uygular
if (!DB.studio) { guessLang(); renderWizard(); }
else {
  const n = topUpStanding();        // sabit programları ileriye tamamla
  armNotifications();
  renderShell(); route();
  if (n) toast(isEN()
    ? `${n} new bookings were created from recurring schedules`
    : `Sabit programlardan ${n} yeni rezervasyon oluşturuldu`);
}
</script>
