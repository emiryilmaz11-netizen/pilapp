name: Android bundle (.aab)

# Builds an UNSIGNED release bundle and pushes it to the `aab-build` branch.
# The upload key never goes to GitHub: the bundle is signed afterwards
# with jarsigner by whoever holds pil-upload.keystore.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      # ubuntu-24.04 images ship the Android SDK; just add what this app needs
      - name: Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null

      - run: npm ci
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew bundleRelease --no-daemon

      - name: Publish bundle to aab-build branch
        run: |
          mkdir out && cp android/app/build/outputs/bundle/release/app-release.aab out/app-release-unsigned.aab
          cd out
          echo "$GITHUB_SHA" > SOURCE_COMMIT
          git init -q -b aab-build
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Unsigned bundle for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" aab-build

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: out/app-release-unsigned.aab
